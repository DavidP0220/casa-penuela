/* ===========================================================================
   Mi Casa — lógica pura (sin pantalla).
   Se prueba con node (pruebas/logica.test.mjs) y se incrusta en ENTREGA/Mi_Casa.html.
   Todas las fechas son texto 'AAAA-MM-DD'. Nada aquí toca el DOM.

const MS_DIA = 86400000;

/* ---------- fechas ---------- */

/* ---------- formato ---------- */
function fCorta(s) { const a = s.split('-'); return +a[2] + ' ' + MES3[+a[1] - 1] + ' ' + a[0]; }

}

}

}
function apocope(s) { return s.replace(/veintiuno$/, 'veintiún').replace(/uno$/, 'un'); }
function numeroALetras(n) {
  n = Math.floor(Math.abs(n));
  if (n === 0) return 'cero pesos';
  const U = ['', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciséis', 'diecisiete', 'dieciocho', 'diecinueve', 'veinte', 'veintiuno', 'veintidós', 'veintitrés', 'veinticuatro', 'veinticinco', 'veintiséis', 'veintisiete', 'veintiocho', 'veintinueve'];
  const D = ['', '', '', 'treinta', 'cuarenta', 'cincuenta', 'sesenta', 'setenta', 'ochenta', 'noventa'];
  const C = ['', 'ciento', 'doscientos', 'trescientos', 'cuatrocientos', 'quinientos', 'seiscientos', 'setecientos', 'ochocientos', 'novecientos'];

/* ---------- estado base ---------- */
const CLAVES_LISTA = ['personas', 'cargos', 'pagos', 'facturas', 'reglas', 'compromisos', 'zonas', 'eventos', 'cosas', 'prestamos', 'novedades', 'gastos', 'papelera', 'log'];
function estadoVacio() {
  return {
    v: 2,
    cfg: Object.assign({ casa: 'Casa Peñuela', dueno: '', duenoCompleto: '', documento: '', direccion: '', ciudad: 'Bucaramanga', telefonos: '', correo: '', logo: '', firma: '', tema: 'oscuro', serviciosIncluidos: true, qrs: [], semillaPersonas: '', semillasAplicadas: [], perfilEditado: false, informeCorreo: '', informeWhatsApp: '', envio: { servicio: '', url: '', clave: '' }, redondeo: 100, gracia: 0, datosPago: '', ultimoRespaldo: null, aseoDia: 0, aseoDueno: true, aseoInicio: null, proximaReunion: null },
      typeof PERFIL_DUENO !== 'undefined' ? PERFIL_DUENO : {}, typeof FIRMA_INICIAL !== 'undefined' ? { firma: FIRMA_INICIAL } : {}),
    personas: [], cargos: [], pagos: [], facturas: [],

}
function normalizar(s) {

  if (typeof PERFIL_DUENO !== 'undefined' && !o.cfg.perfilEditado) {

    if (o.cfg.ciudad === 'Bucaramanga' && PERFIL_DUENO.ciudad) o.cfg.ciudad = PERFIL_DUENO.ciudad;   // 'Bucaramanga' era el valor por defecto de la versión vieja

/* ---------- tiempo en la casa ---------- */
function tiempoVivido(p, hoy) {
  if (hoy < p.ingreso) return { estado: 'porLlegar', faltan: dif(p.ingreso, hoy), dias: 0 };
  const salio = !!(p.salida && p.salida <= hoy);
  const fin = salio ? p.salida : hoy;
  const dias = dif(fin, p.ingreso);
  let meses = 0;
  while (sumarMeses(p.ingreso, meses + 1) <= fin) meses++;
  const resto = dif(fin, sumarMeses(p.ingreso, meses));
  return { estado: salio ? 'salio' : 'activo', dias, mesesTotal: meses, anios: Math.floor(meses / 12), meses: meses % 12, resto, fin, desde: p.ingreso, texto: textoDuracion(Math.floor(meses / 12), meses % 12, resto) };
}
/* Dónde va la persona dentro de su periodo de cobro actual: "día 9 de 31, faltan 23 para que cierre". */
function cicloActual(p, hoy) {
  const t = tiempoVivido(p, hoy); if (t.estado !== 'activo') return null;
  const pe = periodosDe(p, hoy).filter(x => x.ini <= hoy && hoy < x.fin).pop(); if (!pe) return null;
  const total = dif(pe.fin, pe.ini), dia = dif(hoy, pe.ini) + 1;
  return { ini: pe.ini, fin: pe.fin, dia, total, faltan: dif(pe.fin, hoy), pct: Math.min(100, Math.round(dia / total * 100)), calendario: p.ciclo === 'calendario' };
}
function proximoHito(p, t) {
  if (t.estado !== 'activo') return null;
  const m = t.mesesTotal + 1;
  const fecha = sumarMeses(p.ingreso, m);
  if (p.salida && fecha > p.salida) return null;
  return { meses: m, fecha, texto: textoMeses(m) };
}

/* ---------- cobro por reglas ---------- */
function precioEn(p, fecha) {
  const ps = (p.precios || []).slice().sort((a, b) => a.desde < b.desde ? -1 : a.desde > b.desde ? 1 : 0);
  let v = ps.length ? ps[0].monto : 0;
  for (const x of ps) if (x.desde <= fecha) v = x.monto;
  return v;
}
function redondear(x, u) { u = u || 1; return Math.round(x / u) * u; }

function periodosDe(p, limite) {
  const out = []; const sal = p.salida || '9999-12-31';
  if (p.ciclo === 'calendario') {
    let y = +p.ingreso.slice(0, 4), m = +p.ingreso.slice(5, 7);
    for (let i = 0; i < 720; i++) {
      const nIni = y + '-' + p2(m) + '-01'; const nFin = sumarMeses(nIni, 1);
      const ini = mx(nIni, p.ingreso), fin = mn(nFin, sal);

      m++; if (m > 12) { m = 1; y++; }
    }
  } else {
    for (let k = 0; k < 720; k++) {
      const ini = sumarMeses(p.ingreso, k);
      if (ini > limite || ini >= sal) break;
      const nFin = sumarMeses(p.ingreso, k + 1);
      out.push({ nIni: ini, nFin, ini, fin: mn(nFin, sal), primero: k === 0 });
    }
  }

}

function cargosRenta(p, cfg, limite) {
  const u = cfg.redondeo || 1; const out = [];
  for (const pe of periodosDe(p, limite)) {
    const dias = dif(pe.fin, pe.ini); if (dias <= 0) continue;
    const natural = dif(pe.nFin, pe.nIni);
    const precio = precioEn(p, pe.ini);
    let monto, parcial = false;
    if (p.unidad === 'dia') monto = precio * dias;
    else {
      let completo = dias === natural;
      if (!completo && p.ciclo === 'calendario' && p.primerMes === 'completo' && pe.primero && pe.fin === pe.nFin) completo = true;
      if (completo) monto = precio; else { monto = redondear(precio * dias / natural, u); parcial = true; }
    }
    if (monto <= 0) continue;
    let due;
    if (p.ciclo === 'calendario') {
      const dp = Math.max(1, Math.min(31, +p.diaPago || 1));
      const dpf = (y, m) => y + '-' + p2(m) + '-' + p2(Math.min(dp, diasDelMes(y, m)));
      if (p.momento === 'vencido') {
        due = dpf(+pe.nFin.slice(0, 4), +pe.nFin.slice(5, 7));
        if (p.salida) due = mn(due, p.salida);
        due = mx(due, pe.ini);
      } else due = mx(dpf(pe.y, pe.m), pe.ini);
    } else due = p.momento === 'vencido' ? pe.fin : pe.ini;
    if (p.cuentaDesde && due < p.cuentaDesde) continue;   // lo anterior se dio por pagado
    let concepto;
    const hasta = sumarDias(pe.fin, -1);
    if (p.unidad === 'dia') concepto = 'Hospedaje: ' + plural(dias, 'día', 'días') + ' (' + fSinAnio(pe.ini) + ' al ' + fSinAnio(hasta) + ')';
    else if (p.ciclo === 'calendario') concepto = 'Arriendo de ' + MESES[+pe.nIni.slice(5, 7) - 1] + ' ' + pe.nIni.slice(0, 4) + (parcial ? ' (' + dias + ' de ' + natural + ' días)' : '');
    else concepto = 'Arriendo del ' + fSinAnio(pe.ini) + ' al ' + fSinAnio(hasta) + (parcial ? ' (' + dias + ' de ' + natural + ' días)' : '');
    out.push({ id: 'r:' + p.id + ':' + pe.ini, personaId: p.id, fecha: due, concepto, monto, tipo: 'arriendo', origen: 'regla', parcial, periodo: { ini: pe.ini, fin: pe.fin } });
  }
  return out;
}

/* ---------- servicios (luz, agua, internet...) repartidos por días vividos ---------- */
function repartoFactura(S, f) {
  const u = S.cfg.redondeo || 1;
  const hastaEx = sumarDias(f.hasta, 1);
  const totalDias = Math.max(1, dif(hastaEx, f.desde));
  const partes = [];
  for (const id of f.personas || []) {
    const p = S.personas.find(x => x.id === id); if (!p) continue;
    const a = mx(f.desde, p.ingreso), b = mn(hastaEx, p.salida || '9999-12-31');
    const dias = Math.max(0, dif(b, a));
    partes.push({ personaId: id, nombre: p.nombre, dias, peso: f.reparto === 'iguales' ? (dias > 0 ? 1 : 0) : dias, monto: 0 });
  }
  let dueno = null;
  if (f.incluirDueno) dueno = { dias: totalDias, peso: f.reparto === 'iguales' ? 1 : totalDias, monto: 0 };
  const suma = partes.reduce((s, x) => s + x.peso, 0) + (dueno ? dueno.peso : 0);
  if (suma > 0) {
    let asignado = 0;
    for (const x of partes) { x.monto = redondear(f.total * x.peso / suma, u); asignado += x.monto; }
    if (dueno) { dueno.monto = redondear(f.total * dueno.peso / suma, u); asignado += dueno.monto; }
    const resto = f.total - asignado;
    if (resto !== 0) {
      const obj = dueno || partes.reduce((m, x) => (!m || x.monto > m.monto) ? x : m, null);
      if (obj) obj.monto += resto;
    }
  }
  return { partes, dueno, totalDias, repartido: partes.reduce((s, x) => s + x.monto, 0) };
}

function cmpFecha(a, b) { return a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : (a.id < b.id ? -1 : a.id > b.id ? 1 : 0); }

function cargosPersona(S, p, limite) {
  const arr = cargosRenta(p, S.cfg, limite);
  for (const c of S.cargos) if (c.personaId === p.id) arr.push(Object.assign({}, c, { tipo: 'otro', origen: 'manual' }));
  for (const f of S.facturas) {
    if (!(f.personas || []).includes(p.id)) continue;
    const r = repartoFactura(S, f); const x = r.partes.find(y => y.personaId === p.id);
    if (x && x.monto > 0) arr.push({ id: 'f:' + f.id + ':' + p.id, personaId: p.id, fecha: f.cobrarEl, concepto: f.concepto + ' (' + x.dias + ' de ' + r.totalDias + ' días · ' + fSinAnio(f.desde) + ' al ' + fSinAnio(f.hasta) + ')', monto: x.monto, tipo: 'servicio', origen: 'factura', facturaId: f.id });
  }
  return arr.sort(cmpFecha);
}

/* ---------- estado de cuenta: los pagos cubren primero lo más viejo ---------- */
function estadoCuenta(S, p, hoy, limite) {
  limite = limite || sumarDias(hoy, 45);
  const cargos = cargosPersona(S, p, limite);
  const creditos = S.pagos.filter(x => x.personaId === p.id).slice().sort(cmpFecha);
  const credHoy = creditos.filter(x => x.fecha <= hoy);
  const totalCreditos = credHoy.reduce((s, x) => s + x.monto, 0);
  let resto = totalCreditos;
  const gracia = S.cfg.gracia || 0;
  for (const c of cargos) {
    c.pagado = Math.min(resto, c.monto); resto -= c.pagado; c.pendiente = c.monto - c.pagado;
    if (c.pendiente <= 0) c.estado = 'pagado';
    else if (c.fecha > hoy) c.estado = c.pagado > 0 ? 'parcial' : 'proximo';
    else if (hoy > sumarDias(c.fecha, gracia)) c.estado = 'vencido';
    else c.estado = 'porPagar';
  }
  const cargosHoy = cargos.filter(c => c.fecha <= hoy);
  const deuda = cargosHoy.reduce((s, c) => s + c.pendiente, 0);
  const vencido = cargos.filter(c => c.estado === 'vencido').reduce((s, c) => s + c.pendiente, 0);
  const proximo = cargos.find(c => c.fecha > hoy && c.pendiente > 0) || null;
  const ev = [];
  cargosHoy.forEach(c => ev.push({ k: 'cargo', fecha: c.fecha, c }));
  credHoy.forEach(x => ev.push({ k: 'pago', fecha: x.fecha, x }));
  ev.sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : (a.k === b.k ? 0 : a.k === 'cargo' ? -1 : 1));
  let saldo = 0;
  for (const e of ev) { saldo += e.k === 'cargo' ? e.c.monto : -e.x.monto; e.saldo = saldo; }
  const totalCargado = cargosHoy.reduce((s, c) => s + c.monto, 0);
  return { cargos, cargosHoy, proximos: cargos.filter(c => c.fecha > hoy), deuda, vencido, proximo, aFavor: resto, libro: ev, totalCargado, totalPagado: credHoy.filter(x => x.tipo !== 'descuento').reduce((s, x) => s + x.monto, 0), totalDescuentos: credHoy.filter(x => x.tipo === 'descuento').reduce((s, x) => s + x.monto, 0) };
}

/* Cómo se llama un movimiento a favor de la persona: pago recibido, descuento, o abono por compensación (p. ej. un trabajo que ella le hizo al dueño). */
function etiquetaCredito(x) { return x.tipo === 'descuento' ? (x.metodo === 'Compensación' ? 'Abono por compensación' : 'Descuento') : 'Pago'; }
function detalleCredito(x) { return etiquetaCredito(x) + (x.metodo && x.metodo !== 'Compensación' ? ' · ' + x.metodo : ''); }
function custodia(p) { return (p.deposito.recibido || 0) - (p.deposito.devuelto || 0); }

function resumenPersona(S, p, hoy) {
  const t = tiempoVivido(p, hoy), c = estadoCuenta(S, p, hoy);
  let nivel, etiqueta;
  if (t.estado === 'porLlegar') { nivel = 'azul'; etiqueta = 'Llega ' + enDias(t.faltan); }
  else if (t.estado === 'salio') {
    if (c.deuda > 0) { nivel = 'rojo'; etiqueta = 'Se fue y debe ' + pesos(c.deuda); }
    else if (custodia(p) > 0 || (p.lista || []).some(x => x.tipo === 'salida' && !x.hecho)) { nivel = 'ambar'; etiqueta = 'Se fue · pendientes'; }
    else { nivel = 'gris'; etiqueta = 'Se fue · cerrado'; }
  }
  else if (c.vencido > 0) { nivel = 'rojo'; etiqueta = 'Vencido ' + pesos(c.vencido); }
  else if (c.deuda > 0) { nivel = 'ambar'; etiqueta = 'Por pagar ' + pesos(c.deuda); }
  else { nivel = 'verde'; etiqueta = 'Al día'; }
  return { p, t, c, nivel, etiqueta };
}

/* ---------- aseo: rotación semanal ---------- */
function participantesAseo(S, lunes) {
  const fin = sumarDias(lunes, 7);
  const lista = S.personas.filter(p => p.ingreso < fin && (!p.salida || p.salida > lunes))
    .sort((a, b) => a.ingreso < b.ingreso ? -1 : a.ingreso > b.ingreso ? 1 : (a.id < b.id ? -1 : 1))
    .map(p => ({ id: p.id, nombre: p.nombre }));
  if (S.cfg.aseoDueno) lista.unshift({ id: 'dueno', nombre: S.cfg.dueno || 'Yo' });
  return lista;
}
function limiteAseo(S, lunes) { return sumarDias(lunes, ((S.cfg.aseoDia || 0) + 6) % 7); }
function aseoSemana(S, lunes, hoy) {
  const parts = participantesAseo(S, lunes); const idx = indiceSemana(lunes); const lim = limiteAseo(S, lunes);

/* ---------- pendientes: lo que no se puede quedar en el aire ---------- */
const ORDEN_NIVEL = { rojo: 0, ambar: 1, azul: 2, gris: 3 };
function pendientes(S, hoy) {

/* ---------- agenda de los próximos días ---------- */

/* ---------- totales del inicio ---------- */

/* ---------- línea de tiempo de la casa ---------- */

  for (const p of S.personas) {
    if (p.ingreso < ini) ini = p.ingreso;
    if (p.ingreso > fin) fin = p.ingreso;
    if (p.salida && p.salida > fin) fin = p.salida;
  }
  ini = sumarDias(ini, -7); fin = sumarDias(fin, 30);
  const total = dif(fin, ini); const pct = f => Math.max(0, Math.min(100, dif(f, ini) / total * 100));

    const t = tiempoVivido(p, hoy); const segs = [];
    if (t.estado === 'porLlegar') segs.push({ tipo: 'futuro', a: pct(p.ingreso), b: pct(p.salida || fin) });

/* ---------- inquilinos duplicados: encontrar, unir y dejar copia en la papelera ---------- */

/* Pasa todo lo de «dup» a «keep» y deja la ficha de «dup» en la papelera. Devuelve cuánto movió, o null si no se pudo. */
function fusionarPersonas(S, keepId, dupId, motivo, ahora) {

  S.pagos.forEach(x => { if (x.personaId === dupId) { x.personaId = keepId; r.pagos++; } });
  S.cargos.forEach(x => { if (x.personaId === dupId) { x.personaId = keepId; r.cargos++; } });
  S.prestamos.forEach(x => { if (x.personaId === dupId) { x.personaId = keepId; r.prestamos++; } });
  S.cosas.forEach(x => { if (x.responsableId === dupId) { x.responsableId = keepId; r.cosas++; } });

/* ---------- servicios mes a mes y cruce de cuentas ---------- */
function mesesEntre(desde, hasta) { const out = []; let m = desde + '-01'; const fin = hasta + '-01'; for (let i = 0; m <= fin && i < 600; i++) { out.push(m.slice(0, 7)); m = sumarMeses(m, 1); } return out; }
function mesDe(fecha) { return fecha.slice(0, 7); }
function gastosDelMes(S, mes) { return S.gastos.filter(g => g.mes === mes); }

  }

function ajustarPrevia(d) {
  const doc = $('#docPrev', d); if (!doc) return; const ancho = $('.prev-wrap', d).clientWidth - 22;   // 22 = barra de desplazamiento
  doc.style.zoom = Math.min(1, Math.max(0.3, ancho / 860)).toFixed(3);

/* ===========================================================================
   Casa Peñuela — lo que ve cada inquilino en su celular (solo lectura).
   Dos partes:
   · vistaPayload(): lo que se publica de UNA persona (solo lo suyo: sin notas privadas ni datos de las otras).
   · vistaHTML():    la pantalla. Los días y los vencimientos se calculan con la fecha de HOY en el celular de quien la abre,
                     así que avanzan solos sin que David publique nada; los pagos aparecen cuando David los anota.
   Usa las mismas funciones de logica.js y docs.js que la app: los números no pueden salir distintos.
   =========================================================================== */
const VISTA_V = 1;

function vistaPayload(S0, p, ahoraISO) {
  const c = S0.cfg;
  // Las rentas se calculan solas con las reglas de la persona; aquí solo van los cobros sueltos y los servicios ya repartidos.
  const cargos = cargosPersona(S0, p, '0000-01-01').filter(x => x.origen !== 'regla').map(x => ({ id: x.id, fecha: x.fecha, concepto: x.concepto, monto: x.monto }));
  const pagos = S0.pagos.filter(x => x.personaId === p.id).map(x => ({ id: x.id, fecha: x.fecha, monto: x.monto, tipo: x.tipo, metodo: x.metodo || '', nota: x.nota || '', numero: x.numero || 0 }));
  const persona = {};
  ['id', 'nombre', 'cuarto', 'ingreso', 'salida', 'unidad', 'ciclo', 'diaPago', 'momento', 'primerMes', 'cuentaDesde'].forEach(k => { persona[k] = p[k] === undefined ? null : p[k]; });
  persona.precios = (p.precios || []).map(x => ({ desde: x.desde, monto: x.monto }));
  return {
    v: VISTA_V, generado: ahoraISO, acuerdoVersion: S0.acuerdoVersion || 1,
    cfg: { casa: c.casa, dueno: c.dueno, duenoCompleto: c.duenoCompleto, ciudad: c.ciudad, telefonos: c.telefonos || '', correo: c.correo || '', redondeo: c.redondeo, gracia: c.gracia, datosPago: c.datosPago || '', qrs: (c.qrs || []).map(q => ({ nombre: q.nombre, img: q.img })) },
    persona, cargos, pagos,
    aceptacion: p.acuerdo ? { fecha: p.acuerdo.fecha, version: p.acuerdo.version, nombre: p.acuerdo.nombre || '' } : null   // lo que firmó, para que lo vea de vuelta
  };
}

function estadoDesdePayload(pl) {
  const s = estadoVacio();
  s.cfg = Object.assign(s.cfg, pl.cfg);
  s.personas = [Object.assign({ deposito: { acordado: 0, recibido: 0, devuelto: 0 }, lista: [], acuerdo: null }, pl.persona)];
  s.cargos = pl.cargos.map(x => Object.assign({ personaId: pl.persona.id }, x));
  s.pagos = pl.pagos.map(x => Object.assign({ personaId: pl.persona.id }, x));
  s.acuerdoVersion = pl.acuerdoVersion || 1;
  return normalizar(s);
}

function vistaFechaHora(iso) {
  const d = new Date(iso); if (isNaN(d)) return { dia: '', hora: '' };
  const z = 'America/Bogota';
  return {
    dia: d.toLocaleDateString('es-CO', { day: 'numeric', month: 'short', year: 'numeric', timeZone: z }).replace(/\./g, '').replace(/ de /g, ' '),
    hora: d.toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit', timeZone: z }).replace(/\s+/g, ' ')
  };
}

const PROYECTO = 'casa-penuela';

let PL = null;
function byId(id) { return document.getElementById(id); }

function leerMemo(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function guardarMemo(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } }
function claveDeLaUrl() {
  const h = decodeURIComponent((location.hash || '').replace(/^#\/?/, '')).trim();
  if (h) { guardarMemo('cp_clave', h); return h; }   // se recuerda la última clave abierta en este celular: así la app instalada abre sola la cuenta de quien la usa
  const g = leerMemo('cp_clave'); return typeof g === 'string' ? g.trim() : '';
}
function hoyUTC() { const d = new Date(); return d.getUTCFullYear() + '-' + (d.getUTCMonth() + 1) + '-' + d.getUTCDate(); }
/* Crea UN documento nuevo (nunca cambia uno que ya existe; las reglas del servidor también lo impiden). Es lo único que esta página escribe. */
async function escribir(coleccion, id, campos) {
  const nombre = 'projects/' + PROYECTO + '/databases/(default)/documents/' + coleccion + '/' + id;
  let r;
  try { r = await fetch(CONFIG.api + ':commit?key=' + encodeURIComponent(CONFIG.key), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ writes: [{ update: { name: nombre, fields: campos }, currentDocument: { exists: false } }] }) }); }
  catch (e) { const x = new Error('sin-red'); x.sinRed = true; throw x; }
  if (!r.ok) { const x = new Error('http-' + r.status); x.status = r.status; throw x; }
}
function mensaje(el, texto, tipo) { if (el) { el.textContent = texto; el.className = 'v-msg' + (tipo ? ' ' + tipo : ''); } }
function textoError(e, accion) {
  if (e && e.sinRed) return 'No hay internet. Conéctate y vuelve a tocar ' + accion + '.';
  if (e && e.status === 403) return 'No se pudo guardar. Revisa que tu enlace sea el que te mandó ' + quien() + ' y que la fecha y la hora de tu celular estén bien.';
  return 'No se pudo guardar (' + ((e && e.status) || 'error') + '). Intenta de nuevo en un rato.';
}
function digitos(s) { return String(s == null ? '' : s).replace(/\D/g, ''); }
function cedulaOk() { const d = digitos(valor('v-doc')); return d.length >= 6 && d.length <= 12; }
function actualizarAcepto() { const b = byId('v-btn-acepto'); if (b) b.disabled = !(valor('v-nom').trim().length >= 3 && cedulaOk() && marcado('v-chk')); }
function actualizarSug() { const b = byId('v-btn-sug'), c = byId('v-cuenta'); if (c) c.textContent = valor('v-sug').length; if (b) b.disabled = !valor('v-sug').trim(); }
async function aceptar() {
  const clave = claveDeLaUrl(), nom = valor('v-nom').trim().replace(/\s+/g, ' '), btn = byId('v-btn-acepto'), msg = byId('v-msg-acepto');
  if (!btn || nom.length < 3 || !cedulaOk() || !marcado('v-chk') || !PL) return;
  const version = PL.acuerdoVersion || 1; btn.disabled = true; mensaje(msg, 'Guardando…', '');
  let nombreFirmado = nom;
  try { await escribir('aceptaciones', clave + '_' + version, { clave: { stringValue: clave }, nombre: { stringValue: nom }, documento: { stringValue: digitos(valor('v-doc')) }, version: { integerValue: String(version) }, t: { timestampValue: new Date().toISOString() } }); }
  catch (e) { if (e.status === 409) nombreFirmado = ''; else { mensaje(msg, textoError(e, 'Aceptar'), 'mal'); actualizarAcepto(); return; } }   // 409: ya estaba aceptado desde otro aparato
  guardarMemo('cp_acepto_' + clave.slice(0, 10), { version, fecha: hoyReal(), nombre: nombreFirmado });
  await pintar();
}
async function sugerir() {
  const clave = claveDeLaUrl(), texto = valor('v-sug').trim(), btn = byId('v-btn-sug'), msg = byId('v-msg-sug');
  if (!btn || !texto) return;
  btn.disabled = true; mensaje(msg, 'Enviando…', '');
  try { await escribir('sugerencias', clave + '_' + hoyUTC(), { clave: { stringValue: clave }, texto: { stringValue: texto.slice(0, 400) }, t: { timestampValue: new Date().toISOString() } }); }
  catch (e) { if (e.status !== 409) { mensaje(msg, textoError(e, 'Enviar'), 'mal'); actualizarSug(); return; } }   // 409: ya envió una hoy
  guardarMemo('cp_sug_' + clave.slice(0, 10), hoyUTC());
  await pintar();
}

function instalacionPospuesta() { const t = leerMemo('cp_inst_no'); return typeof t === 'number' && Date.now() - t < 7 * 864e5; }   // «Ahora no»: no se vuelve a ofrecer por una semana
function prepararInstalacion() {

  caja.hidden = false; btn.hidden = !EVT_INSTALAR;
  if (EVT_INSTALAR) txt.textContent = 'Toca el botón y queda un ícono en la pantalla de tu celular. Se abre como una app, a pantalla completa.';
  else if (ios) txt.innerHTML = 'En iPhone se instala desde Safari:<ol><li>Si la abriste desde WhatsApp, toca el ícono de la brújula (Abrir en Safari).</li><li>Toca el botón Compartir (el cuadrito con la flecha hacia arriba).</li><li>Elige «Añadir a pantalla de inicio».</li></ol>';
  else txt.innerHTML = 'En Android:<ol><li>Si la abriste desde WhatsApp, toca los tres puntos ⋮ y «Abrir en Chrome».</li><li>En Chrome, toca otra vez los tres puntos ⋮ y elige «Instalar app» o «Añadir a la pantalla de inicio».</li></ol>';
}
async function instalar() { if (!EVT_INSTALAR) return; EVT_INSTALAR.prompt(); try { await EVT_INSTALAR.userChoice; } catch (e) { /* nada */ } EVT_INSTALAR = null; prepararInstalacion(); }
/* El manifiesto de la app instalada lleva en su dirección de inicio la clave de ESTA persona (solo en su celular), y se registra el servicio que deja abrirla sin internet. */
function prepararApp() {
  try {
    const clave = claveDeLaUrl(), enlace = byId('v-manifest'); if (!clave || !enlace || !window.URL || !URL.createObjectURL) return;
    const base = new URL('./', location.href).href, img = n => new URL('../img/' + n, location.href).href;
    const m = { name: 'Mi cuenta · Casa Peñuela', short_name: 'Mi cuenta', description: 'Tus días en la casa, lo que debes y tus pagos.', id: base, start_url: base + '#' + clave, scope: base, display: 'standalone', orientation: 'portrait', lang: 'es', background_color: '#0A0C14', theme_color: '#0A0C14',
      icons: [{ src: img('icono-192.png'), sizes: '192x192', type: 'image/png', purpose: 'any' }, { src: img('icono-512.png'), sizes: '512x512', type: 'image/png', purpose: 'any' }, { src: img('icono-maskable-512.png'), sizes: '512x512', type: 'image/png', purpose: 'maskable' }] };
    enlace.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
  } catch (e) { /* queda el manifiesto fijo */ }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || LOCAL)) navigator.serviceWorker.register('sw.js').catch(() => { /* sin servicio, igual funciona */ });
}
async function traer() {
  const clave = claveDeLaUrl();
  if (!/^[A-Za-z0-9_-]{20,80}$/.test(clave)) throw new Error('Este enlace está incompleto. Pídele a David que te lo mande otra vez.');
  const memo = 'cuenta_' + clave.slice(0, 10);
  const deMemoria = () => { const g = leerMemo(memo); if (g) g.__memoria = true; return g; };
  let r;
  try { r = await fetch(CONFIG.api + '/vistas/' + encodeURIComponent(clave) + '?key=' + encodeURIComponent(CONFIG.key), { cache: 'no-store' }); }
  catch (e) { const g = deMemoria(); if (g) return g; throw new Error('No hay internet y todavía no habías abierto tu cuenta en este celular. Conéctate y vuelve a abrir el enlace.'); }
  if (r.status === 404) { try { localStorage.removeItem(memo); } catch (e) { /* nada */ } throw new Error('Este enlace ya no sirve. Pídele a David que te mande el nuevo.'); }
  if (!r.ok) { const g = deMemoria(); if (g) return g; throw new Error('No pude abrir tu cuenta en este momento (' + r.status + '). Intenta de nuevo en un rato.'); }
  const d = await r.json(); const pl = JSON.parse(d.fields.json.stringValue); guardarMemo(memo, pl); return pl;
}
async function pintar() {
  const cont = byId('app');
  const borrador = { nom: valor('v-nom'), doc: valor('v-doc'), chk: marcado('v-chk'), sug: valor('v-sug') };   // lo que estaba escribiendo no se pierde si la página se refresca
  try {
    const pl = await traer(); PL = pl;
    S = estadoDesdePayload(pl);
    const clave = claveDeLaUrl(), ui = { acepto: leerMemo('cp_acepto_' + clave.slice(0, 10)), sugHoy: leerMemo('cp_sug_' + clave.slice(0, 10)) === hoyUTC() };
    cont.innerHTML = '<div class="doc movil">' + (pl.__memoria ? '<div class="v-sinred">Sin internet: te muestro lo último que viste. Los días sí están al día de hoy; los pagos nuevos se ven cuando vuelvas a tener internet.</div>' : '') + vistaHTML(pl, HOY(), CONFIG.base, ui) + '</div>';
    if (byId('v-nom')) { byId('v-nom').value = borrador.nom; byId('v-doc').value = borrador.doc; byId('v-chk').checked = borrador.chk; }
    if (byId('v-sug')) byId('v-sug').value = borrador.sug;
    actualizarAcepto(); actualizarSug(); prepararInstalacion();
  } catch (e) { cont.innerHTML = pantallaAviso('No pude abrir tu cuenta', (e && e.message) || 'Pídele a David que te mande el enlace otra vez.'); }
}
document.addEventListener('input', e => { const i = e.target && e.target.id; if (i === 'v-nom' || i === 'v-doc') actualizarAcepto(); else if (i === 'v-sug') actualizarSug(); });
document.addEventListener('change', e => { if (e.target && e.target.id === 'v-chk') actualizarAcepto(); });
document.addEventListener('click', e => { const i = e.target && e.target.id; if (i === 'v-btn-acepto') aceptar(); else if (i === 'v-btn-sug') sugerir(); else if (i === 'v-inst-btn') instalar(); else if (i === 'v-inst-no') { guardarMemo('cp_inst_no', Date.now()); prepararInstalacion(); } });
prepararApp();
pintar();
window.addEventListener('hashchange', () => { prepararApp(); pintar(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) pintar(); });
