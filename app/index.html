/* =========================  INQUILINOS DUPLICADOS  ========================= */
function dlgDuplicados() {
  const grupos = encontrarDuplicados(S);
  if (!grupos.length) { dialogo({ titulo: 'Inquilinos duplicados', cuerpo: '<p class="info-caja">No encontré inquilinos duplicados. ✔</p><p class="peq">Reviso si dos personas tienen el mismo nombre, o el mismo teléfono.</p>', pie: '<button type="button" class="btn primario" data-a="cerrarDlg">Listo</button>' }); return; }
  const hoy = HOY();
  const cuerpo = grupos.map((g, i) => `<fieldset style="border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 12px"><legend style="padding:0 6px;font-weight:700">Posible duplicado ${i + 1} · ${esc(g.motivos.join(' y '))}</legend><p class="peq" style="margin:0 0 6px">Marca cuál se queda; a ese se le pasa todo lo de los demás.</p>${g.personas.map((p, j) => { const m = movimientosDe(S, p.id); return `<label class="chk"><input type="radio" name="keep${i}" value="${p.id}" ${j === 0 ? 'checked' : ''}><span><b>${esc(p.nombre)}</b> · ${esc(p.cuarto || 'sin habitación')} · llegó ${esc(fCorta(p.ingreso))} · ${esc(pesos(precioEn(p, mx(hoy, p.ingreso))))}/mes<br><small>${esc(p.telefono || 'sin teléfono')} · ${plural(m.pagos, 'pago', 'pagos')}, ${plural(m.cargos, 'cobro extra', 'cobros extra')}, ${plural(m.cosas + m.prestamos, 'cosa', 'cosas')}</small></span></label>`; }).join('')}${F.chk('Unir y quitar los demás de este grupo' + (g.seguro ? '' : ' (revísalo antes: no es seguro que sean la misma persona)'), 'unir' + i, g.seguro)}</fieldset>`).join('');
  dialogo({
    titulo: 'Inquilinos duplicados', guardar: 'Unir los marcados',
    cuerpo: `<p>Encontré <b>${plural(grupos.length, 'grupo', 'grupos')}</b> que parece repetido. Lo que quites no se pierde: queda en la papelera de Ajustes.</p>${cuerpo}`,
    onOk(fd) {
      const ahora = new Date().toISOString(); const hechos = [];
      grupos.forEach((g, i) => { if (!fd.get('unir' + i)) return; const keep = fd.get('keep' + i); g.personas.forEach(p => { if (p.id !== keep) hechos.push([keep, p.id, g.motivos.join(' y ')]); }); });
      if (!hechos.length) return 'No marcaste ningún grupo para unir.';
      const nombres = hechos.map(h => persona(h[1]).nombre); let repetidos = 0;
      mutar('Se unieron ' + plural(hechos.length, 'inquilino duplicado', 'inquilinos duplicados') + ': ' + nombres.join(', '), () => { hechos.forEach(h => { const r = fusionarPersonas(S, h[0], h[1], 'Duplicado (' + h[2] + ')', ahora); if (r) repetidos = Math.max(repetidos, r.repetidos); }); });
      if (repetidos) return () => toast('Ojo: quedaron ' + plural(repetidos, 'pago que parece repetido', 'pagos que parecen repetidos') + '. Revísalos en «Pagos».', { error: true, deshacer: true });
    }
  });
}
ACC.duplicados = () => dlgDuplicados();
ACC.restaurarPapelera = d => { let nom = ''; mutar('Se restauró un inquilino de la papelera', () => { const p = restaurarDePapelera(S, d.id); nom = p ? p.nombre : ''; }); };
ACC.vaciarPapelera = () => confirmar('Vaciar la papelera', 'Se borran para siempre ' + plural(S.papelera.length, 'ficha', 'fichas') + '. Sus pagos y cobros ya están en la ficha que se quedó.', 'Vaciar', () => mutar('Se vació la papelera', () => { S.papelera = []; }));

/* =========================  AJUSTES: limpieza e informes  ========================= */
function ajustesCuentasHTML() {

const VISTA_V = 1;

function vistaPayload(S0, p, ahoraISO) {
  const c = S0.cfg;
  // Las rentas se calculan solas con las reglas de la persona; aquí solo van los cobros sueltos y los servicios ya repartidos.
  const cargos = cargosPersona(S0, p, '0000-01-01').filter(x => x.origen !== 'regla').map(x => ({ id: x.id, fecha: x.fecha, concepto: x.concepto, monto: x.monto }));
  const pagos = S0.pagos.filter(x => x.personaId === p.id).map(x => ({ id: x.id, fecha: x.fecha, monto: x.monto, tipo: x.tipo, metodo: x.metodo || '', nota: x.nota || '', numero: x.numero || 0 }));
  const persona = {};
  ['id', 'nombre', 'cuarto', 'ingreso', 'salida', 'unidad', 'ciclo', 'diaPago', 'momento', 'primerMes', 'cuentaDesde'].forEach(k => { persona[k] = p[k] === undefined ? null : p[k]; });
  persona.precios = (p.precios || []).map(x => ({ desde: x.desde, monto: x.monto }));
  return {
    v: VISTA_V, generado: ahoraISO, acuerdoVersion: S0.acuerdoVersion || 1,
    cfg: { casa: c.casa, dueno: c.dueno, duenoCompleto: c.duenoCompleto, ciudad: c.ciudad, telefonos: c.telefonos || '', correo: c.correo || '', redondeo: c.redondeo, gracia: c.gracia, datosPago: c.datosPago || '', qrs: (c.qrs || []).map(q => ({ nombre: q.nombre, img: q.img })) },
    persona, cargos, pagos
  };
}

function estadoDesdePayload(pl) {

  s.cargos = pl.cargos.map(x => Object.assign({ personaId: pl.persona.id }, x));

function vistaFechaHora(iso) {

    hora: d.toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit', timeZone: z }).replace(/\s+/g, ' ')

}

function nubePosible() {

function nubeSitio() { return location.hostname === 'localhost' ? location.origin + '/' : ((typeof SITIO_PUBLICO !== 'undefined' && SITIO_PUBLICO) || '').replace(/\/*$/, '/'); }

function nubeCodigo(e) { return (e && (e.code || e.message)) ? String(e.code || e.message).replace(/^(auth|firestore)\//, '') : String(e || ''); }

/* ---------- ayudas pequeñas ---------- */
function nubeHash(t) { let h = 5381; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return (h >>> 0).toString(36) + ':' + t.length; }
function nubeClaveNueva() {
  const b = new Uint8Array(24); crypto.getRandomValues(b); let s = ''; b.forEach(x => { s += String.fromCharCode(x); });
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');   // 32 letras y números al azar: imposible de adivinar
}
function nubeMetaLeer() { try { const m = JSON.parse(localStorage.getItem(NUBE_META)); if (m && typeof m === 'object') return Object.assign({ rev: 0, hash: '', vistas: {} }, m); } catch (e) { /* nada */ } return { rev: 0, hash: '', vistas: {} }; }

function nubeContar(json) {   // cuántas personas, pagos, cargos y facturas trae un estado guardado, sin armar la app

  return { personas: n('personas'), pagos: n('pagos'), cargos: n('cargos'), facturas: n('facturas') };

/* Separa lo liviano (estado) de las imágenes pesadas: cada documento de Firestore tiene tope de 1 MiB. La clave de envío automático nunca sale de este aparato. */

}
function nubeUnir(estadoJson, imagenesJson) {
  const o = JSON.parse(estadoJson), img = imagenesJson ? JSON.parse(imagenesJson) : {};

/* ---------- conectar: comparar lo de aquí con lo de la nube ---------- */
async function nubeConectar() {
  if (NUBE.subiendo) return;
  nubeEstado('sincronizando');
  const { doc, getDocFromServer } = NUBE.fs;
  try {
    const s = await getDocFromServer(doc(NUBE.db, 'estado', 'principal'));
    nubeDiag({ ev: 'conectar', existe: s.exists(), revNube: s.exists() ? s.data().rev : null, nubeVacia: s.exists() ? nubeJsonVacio(s.data().json) : null, metaRev: NUBE.meta.rev, hayDatos: nubeHayDatos(), personas: S.personas.length });
    if (!s.exists()) { NUBE.meta.rev = 0; NUBE.meta.hash = ''; }       // la nube no tiene nada: si aquí hay datos se suben tal cual (un aparato vacío no crea nada)
    else {
      const d = s.data(), sucio = nubeSucio();
      if (d.rev !== NUBE.meta.rev && nubeHash(nubePartir().estado) === nubeHash(d.json)) { NUBE.meta.rev = d.rev; NUBE.meta.hash = nubeHash(nubePartir().estado); }   // lo de aquí y lo de la nube son idénticos: no hay nada que escoger, solo se anota la versión
      else if (nubeJsonVacio(d.json) && nubeHayDatos() && (NUBE.meta.rev === 0 || d.rev === NUBE.meta.rev)) { NUBE.meta.rev = d.rev; NUBE.meta.hash = ''; }   // la nube quedó vacía y aquí hay datos: se suben, sin preguntar
      else if (d.rev === NUBE.meta.rev) { /* misma versión: si hay cambios aquí, se suben más abajo */ }
      else if (d.rev > NUBE.meta.rev && (NUBE.meta.rev > 0 ? !sucio : !nubeHayDatos())) await nubeAdoptar(d);   // aparato nuevo y vacío: toma lo de la nube sin preguntar
      else { NUBE.conflicto = d.rev; nubeEstado('conflicto'); nubeResolver(); return; }
    }
    NUBE.ultima = Date.now(); nubeMetaGuardar(); nubeEstado('conectada'); nubeEscuchar();
    await nubeSubir();
  } catch (e) {
    const c = nubeCodigo(e); nubeDiag({ ev: 'error', donde: 'conectar', codigo: c, msg: String((e && e.message) || e).slice(0, 300) });
    if (c === 'permission-denied') { nubeEstado('sinPermiso'); try { await NUBE.au.signOut(NUBE.auth); } catch (_) { /* nada */ } }
    else nubeEstado('sinConexion', e);
  }
}
async function nubeAdoptar(d) {
  const { doc, getDocFromServer } = NUBE.fs;
  const im = await getDocFromServer(doc(NUBE.db, 'estado', 'imagenes'));
  const nuevo = nubeUnir(d.json, im.exists() ? im.data().json : '');
  try { localStorage.setItem(KEY + '_antes_nube_' + Date.now(), JSON.stringify(S)); } catch (e) { /* nada */ }   // por si acaso
  S = nuevo; pilaDeshacer = []; NUBE.meta.rev = d.rev; NUBE.meta.hash = nubeHash(nubePartir().estado); nubeMetaGuardar();
  guardarLocal(); render();
  toast('Se actualizaron tus datos con lo último de la nube.');
}
function nubeEscuchar() {
  if (NUBE.desuscribir) return;
  const { doc, onSnapshot } = NUBE.fs;
  NUBE.desuscribir = onSnapshot(doc(NUBE.db, 'estado', 'principal'), snap => {
    if (!snap.exists() || snap.metadata.hasPendingWrites || NUBE.subiendo || NUBE.estado !== 'conectada') return;
    const d = snap.data(); if (d.rev === NUBE.meta.rev) return;
    if (d.rev > NUBE.meta.rev && !nubeSucio()) nubeAdoptarLibre(d); else { NUBE.conflicto = d.rev; nubeEstado('conflicto'); }
  }, e => { NUBE.desuscribir = null; nubeEstado(nubeCodigo(e) === 'permission-denied' ? 'sinPermiso' : 'sinConexion', e); });
}
function nubeAdoptarLibre(d) {   // no cambia la pantalla mientras David está llenando un formulario
  if (document.getElementById('dlg').open) { setTimeout(() => { if (NUBE.estado === 'conectada' && d.rev > NUBE.meta.rev && !nubeSucio()) nubeAdoptarLibre(d); }, 3000); return; }
  nubeAdoptar(d).catch(e => nubeEstado('sinConexion', e));
}

/* ---------- subir ---------- */
function nubeCambio() {   // lo llama guardar() después de cada cambio
  if (NUBE.estado !== 'conectada') return;
  clearTimeout(NUBE.temporizador); NUBE.temporizador = setTimeout(nubeSubir, 1200);
}
/* Pregunta al servidor, por otro camino (REST, con la sesión de David), qué versión tiene guardada. No usa la memoria del SDK, que justo después de escribir puede devolver la versión vieja. */
async function nubeRevEnServidor() {
  const token = await NUBE.user.getIdToken();
  const r = await fetch('https://firestore.googleapis.com/v1/projects/' + FIREBASE_CONFIG.projectId + '/databases/(default)/documents/estado/principal?mask.fieldPaths=rev', { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' });
  if (!r.ok) throw new Error('rest-' + r.status);
  const d = await r.json();
  return Number((d.fields && d.fields.rev && d.fields.rev.integerValue) || 0);
}
async function nubeSubir() {
  if (NUBE.estado !== 'conectada' || NUBE.subiendo || !NUBE.user) return;
  NUBE.subiendo = true;
  try {
    nubeAsegurarClaves();
    const { estado, imagenes } = nubePartir(), h = nubeHash(estado);
    if (h !== NUBE.meta.hash) {
      nubeDiag({ ev: 'subir', personas: S.personas.length, metaRev: NUBE.meta.rev, hayDatos: nubeHayDatos() });
      if (!nubeHayDatos() && !(NUBE.meta.rev > 0)) { NUBE.meta.hash = h; nubeMetaGuardar(); nubeDiag({ ev: 'omitido', motivo: 'sin datos' }); }   // no hay nada que guardar y la nube nunca tuvo nada de aquí: no se crea un estado vacío
      else {
        if (estado.length > 900000 || imagenes.length > 900000) throw new Error('Los datos pesan demasiado para la nube (límite 1 MB por documento): quita imágenes grandes');
        const { doc, runTransaction, serverTimestamp } = NUBE.fs;
        const refE = doc(NUBE.db, 'estado', 'principal'), refI = doc(NUBE.db, 'estado', 'imagenes');
        const hoy = new Date().toISOString().slice(0, 10), refU = doc(NUBE.db, 'estado', 'copia-ultima'), refD = doc(NUBE.db, 'estado', 'copia-dia-' + new Date().getDay());
        const nueva = await runTransaction(NUBE.db, async tx => {
          const s = await tx.get(refE), dia = await tx.get(refD), rev = s.exists() ? (s.data().rev || 0) : 0;
          if (rev !== (NUBE.meta.rev || 0)) { const x = new Error('conflicto'); x.rev = rev; x.conflicto = true; throw x; }
          const previo = s.exists() ? s.data() : null;
          if (previo && !nubeJsonVacio(previo.json)) {   // lo que se va a reemplazar queda de copia; un estado vacío nunca pisa una copia buena
            const copia = { rev, json: previo.json, t: previo.t || serverTimestamp(), dia: hoy, personas: nubeContar(previo.json).personas };
            tx.set(refU, copia);                                                          // la versión de justo antes del último cambio
            if (!dia.exists() || dia.data().dia !== hoy) tx.set(refD, copia);             // la primera de cada día (siete casillas, una por día de la semana)
          }
          tx.set(refE, { rev: rev + 1, json: estado, t: serverTimestamp() });
          tx.set(refI, { rev: rev + 1, json: imagenes });
          return rev + 1;
        });
        let enServidor = null; try { enServidor = await nubeRevEnServidor(); } catch (e) { nubeDiag({ ev: 'releer-fallo', msg: String((e && e.message) || e).slice(0, 200) }); }
        nubeDiag({ ev: 'releido', esperada: nueva, enServidor });
        if (enServidor !== null && enServidor !== nueva) throw new Error('no-confirmado');   // el servidor dice otra versión: no se marca como guardado
        NUBE.meta.rev = nueva; NUBE.meta.hash = h; nubeMetaGuardar(); nubeDiag({ ev: 'subido', rev: nueva });
      }
    }
    await nubePublicarVistas();
    NUBE.ultima = Date.now(); nubeEstado('conectada');
  } catch (e) {
    nubeDiag({ ev: 'error', donde: 'subir', codigo: nubeCodigo(e), msg: String((e && e.message) || e).slice(0, 300) });
    if (e && e.conflicto) { NUBE.conflicto = e.rev; nubeEstado('conflicto'); nubeResolver(); }
    else if (nubeCodigo(e) === 'permission-denied') nubeEstado('sinPermiso');
    else nubeEstado('sinConexion', e);
  } finally {
    NUBE.subiendo = false;
    if (NUBE.estado === 'conectada' && nubeSucio()) nubeCambio();
  }
}

/* ---------- la cuenta de cada inquilino ---------- */
async function nubePublicarVistas() {
  const { doc, setDoc, deleteDoc, serverTimestamp, getDocFromServer } = NUBE.fs;
  const ahora = new Date().toISOString(); const vivas = {};
  for (const p of S.personas) {
    vivas[p.id] = true;
    const pl = vistaPayload(S, p, ahora), sinHora = JSON.stringify(Object.assign({}, pl, { generado: '' })), h = nubeHash(sinHora);
    let previo = NUBE.meta.vistas[p.id];
    if (previo && previo.clave && !NUBE.vistasVerificadas[p.id]) {   // la primera vez en esta sesión se comprueba en el servidor que lo anotado como publicado de verdad esté
      try {
        const s = await getDocFromServer(doc(NUBE.db, 'vistas', previo.clave)); NUBE.vistasVerificadas[p.id] = true;
        if (!s.exists()) { nubeDiag({ ev: 'vista', id: p.id, accion: 'faltaba-en-la-nube' }); previo = { clave: previo.clave }; }   // sin hash: se vuelve a escribir
      } catch (e) { /* si no se pudo leer, se confía en lo anotado */ }
    }
    const corta = (p.claveVista || '').slice(0, 4) + '…' + (p.claveVista || '').slice(-3);
    if (previo && previo.clave === p.claveVista && previo.hash === h) { nubeDiag({ ev: 'vista', id: p.id, clave: corta, accion: 'omitida' }); continue; }     // no cambió nada de esta persona: no se vuelve a escribir
    nubeDiag({ ev: 'vista', id: p.id, clave: corta, accion: 'escribiendo', tienePrevio: !!previo });
    const json = JSON.stringify(pl);
    if (json.length > 900000) throw new Error('La cuenta de ' + p.nombre + ' pesa demasiado (revisa las imágenes de los QR)');
    await setDoc(doc(NUBE.db, 'vistas', p.claveVista), { json, t: serverTimestamp() });
    if (previo && previo.clave && previo.clave !== p.claveVista) await deleteDoc(doc(NUBE.db, 'vistas', previo.clave));   // la clave cambió: el enlace viejo deja de servir
    NUBE.meta.vistas[p.id] = { clave: p.claveVista, hash: h }; nubeMetaGuardar(); nubeDiag({ ev: 'vista', id: p.id, accion: 'escrita' });
  }
  for (const id of Object.keys(NUBE.meta.vistas)) {
    if (vivas[id]) continue;                                                        // la persona ya no está: su enlace deja de servir
    await deleteDoc(doc(NUBE.db, 'vistas', NUBE.meta.vistas[id].clave)); delete NUBE.meta.vistas[id]; nubeMetaGuardar();
  }
}

  const mesIni = h.slice(0, 8) + '01', mesAnt = sumarMeses(mesIni, -1);
  s.facturas.push({ id: uid(), concepto: 'Luz', total: 186400, desde: mesAnt, hasta: sumarDias(mesIni, -1), cobrarEl: sumarDias(mesIni, 4), reparto: 'dias', personas: [camila.id, andres.id], incluirDueno: true });
  const luzCamila = estadoCuenta(s, camila, h);
  if (luzCamila.deuda > 0) s.pagos.push({ id: uid(), personaId: camila.id, fecha: sumarDias(mesIni, 6), monto: luzCamila.deuda, tipo: 'pago', metodo: 'Nequi', nota: 'Luz', numero: ++s.seq.recibo });
  [[-3, 98300, 41200], [-2, 112500, 38700], [-1, 186400, 45200]].forEach(([k, luz, agua]) => {
    const m = sumarMeses(mesIni, k).slice(0, 7), pagado = sumarDias(sumarMeses(mesIni, k + 1), 8);
    [['Luz', luz], ['Agua', agua], ['Internet', 89900]].forEach(([c, v]) => s.gastos.push({ id: uid(), concepto: c, mes: m, valor: v, pagadoEl: pagado, nota: '' }));
  });
  s.gastos.push({ id: uid(), concepto: 'Luz', mes: mesIni.slice(0, 7), valor: 150000, pagadoEl: '', nota: 'Factura de este mes' }, { id: uid(), concepto: 'Internet', mes: mesIni.slice(0, 7), valor: 89900, pagadoEl: sumarDias(mesIni, 4), nota: '' });
  s.cfg.aseoInicio = sumarDias(lunesDe(h), -28);
  for (let l = lunesDe(s.cfg.aseoInicio); l < lunesDe(h); l = sumarDias(l, 7)) aseoSemana(s, l, h).forEach(f => { s.aseo[f.clave] = { fecha: sumarDias(l, 3), por: f.part ? f.part.id : 'dueno' }; });
  const f0 = aseoSemana(s, lunesDe(h), h)[0]; if (f0) s.aseo[f0.clave] = { fecha: h, por: f0.part ? f0.part.id : 'dueno' };
  const tareas = tareasFiesta(); tareas.slice(0, 5).forEach(t => { t.hecho = true; });
  s.eventos.push({ id: uid(), nombre: 'Cumpleaños de Camila', fecha: sumarDias(h, 5), horaFin: '1:00 a. m.', notas: 'Máximo 10 invitados', cerrado: false, tareas });
  s.cosas.push({ id: uid(), nombre: 'Nevera 300 L', ubicacion: 'Cocina', estado: 'Bueno', responsableId: '', valor: 1800000, notas: '' }, { id: uid(), nombre: 'Cama y colchón', ubicacion: 'Habitación 1', estado: 'Bueno', responsableId: camila.id, valor: 900000, notas: '' }, { id: uid(), nombre: 'Ventilador', ubicacion: 'Habitación 2', estado: 'Regular', responsableId: andres.id, valor: 120000, notas: 'Hace ruido' }, { id: uid(), nombre: 'Computador portátil', ubicacion: 'Mi cuarto', estado: 'Bueno', responsableId: '', valor: 2500000, notas: '' });
  s.prestamos.push({ id: uid(), cosa: 'Taladro', personaId: andres.id, fecha: sumarDias(h, -20), devuelto: null, nota: '' }, { id: uid(), cosa: 'Llaves de la casa', tipo: 'entrega', personaId: camila.id, fecha: sumarDias(h, -158), devuelto: null, nota: '' });
  s.novedades.push({ id: uid(), fecha: sumarDias(h, -2), tipo: 'Faltante', texto: 'No aparece el cargador negro que estaba en la sala', personaId: '', estado: 'abierta', resolucion: '' });
  s.cfg.proximaReunion = sumarDias(h, 4);
  return s;
}

/* Completa lo que falta de una persona de datos_casa.js: cobro mensual el mismo día que llegó, por adelantado, y su lista de ingreso. */
function crearPersonaInicial(d) {
  return Object.assign({ unidad: 'mes', ciclo: 'aniversario', diaPago: 5, momento: 'adelantado', primerMes: 'proporcional', salida: null, cuentaDesde: null, deposito: { acordado: 0, recibido: 0, devuelto: 0 }, lista: listaPorDefecto(false), acuerdo: null, notas: '' }, JSON.parse(JSON.stringify(d)));
}

(function iniciar() {
  let almacenado = null; try { almacenado = localStorage.getItem(KEY); } catch (e) { /* sin almacenamiento */ }
  S = (DEMO && !almacenado) ? crearDemo() : cargar();
  // Personas reales de datos_casa.js: se cargan una sola vez, y solo si la app todavía no tiene a nadie.
  const VERSION_SEMILLA = 'v1';
  if (!DEMO && typeof PERSONAS_INICIALES !== 'undefined' && PERSONAS_INICIALES.length && S.personas.length === 0 && S.cfg.semillaPersonas !== VERSION_SEMILLA) {
    S.personas = PERSONAS_INICIALES.map(crearPersonaInicial); S.cfg.semillaPersonas = VERSION_SEMILLA;
    S.log.unshift({ t: new Date().toISOString(), texto: 'Se cargaron las personas iniciales (' + S.personas.map(p => p.nombre).join(', ') + ')' });
  }
  // Movimientos conocidos de datos_casa.js: una sola vez cada uno, y solo si la persona existe.
  if (!DEMO && typeof PAGOS_INICIALES !== 'undefined') {
    if (!Array.isArray(S.cfg.semillasAplicadas)) S.cfg.semillasAplicadas = [];
    PAGOS_INICIALES.forEach(x => {
      if (S.cfg.semillasAplicadas.includes(x.id) || !S.personas.some(p => p.id === x.personaId)) return;
      S.pagos.push(JSON.parse(JSON.stringify(x))); S.cfg.semillasAplicadas.push(x.id);
      S.log.unshift({ t: new Date().toISOString(), texto: 'Se cargó: ' + etiquetaCredito(x) + ' de ' + pesos(x.monto) + ' a ' + persona(x.personaId).nombre + ' (' + x.nota + ')' });
    });
  }
  if (!DEMO && typeof TAREAS_HECHAS_INICIALES !== 'undefined') {
    TAREAS_HECHAS_INICIALES.forEach(x => {
      const p = S.personas.find(q => q.id === x.personaId); if (!p || S.cfg.semillasAplicadas.includes(x.id)) return;
      const it = (p.lista || []).find(t => t.texto === x.texto); if (it) it.hecho = true;
      S.cfg.semillasAplicadas.push(x.id); S.log.unshift({ t: new Date().toISOString(), texto: 'Marcado como hecho para ' + p.nombre + ': ' + x.texto });
    });
  }
  if (!DEMO && typeof CORRECCIONES_INICIALES !== 'undefined') {
    if (!Array.isArray(S.cfg.semillasAplicadas)) S.cfg.semillasAplicadas = [];
    CORRECCIONES_INICIALES.forEach(x => {
      const p = S.personas.find(q => q.id === x.personaId); if (!p || S.cfg.semillasAplicadas.includes(x.id)) return;
      S.cfg.semillasAplicadas.push(x.id);
      if (p.ingreso !== x.ingresoAntes) { S.log.unshift({ t: new Date().toISOString(), texto: 'No se cambió la fecha de ingreso de ' + p.nombre + ': ya tenía otra fecha (' + p.ingreso + '), revísala' }); return; }
      p.ingreso = x.ingresoNuevo; (p.precios || []).forEach(pr => { if (pr.desde === x.ingresoAntes) pr.desde = x.ingresoNuevo; });
      S.log.unshift({ t: new Date().toISOString(), texto: 'Se corrigió la fecha de ingreso de ' + p.nombre + ': del ' + x.ingresoAntes + ' al ' + x.ingresoNuevo });
    });
  }
  // Limpieza de datos: sacar a quien David retiró y unir inquilinos duplicados seguros. Todo queda en la papelera y en el registro.
  const ahora = new Date().toISOString(); let avisoInicio = '';
  if (!DEMO && typeof PERSONAS_RETIRADAS !== 'undefined') {
    PERSONAS_RETIRADAS.forEach(x => {
      if (S.cfg.semillasAplicadas.includes(x.id)) return; S.cfg.semillasAplicadas.push(x.id);
      const p = S.personas.find(q => q.id === x.personaId || normNombre(q.nombre) === normNombre(x.nombre)); if (!p) return;
      if (totalMovimientos(movimientosDe(S, p.id)) > 0) { S.log.unshift({ t: ahora, texto: 'No se quitó a ' + p.nombre + ' porque ya tiene pagos o cobros: revísalo' }); return; }
      S.papelera.push({ id: nuevoId(), t: ahora, motivo: x.motivo, unidoCon: '', persona: JSON.parse(JSON.stringify(p)) }); S.personas = S.personas.filter(q => q !== p);
      S.log.unshift({ t: ahora, texto: 'Se quitó a ' + p.nombre + ': ' + x.motivo + ' (queda en la papelera)' }); avisoInicio += 'Se quitó a ' + p.nombre + ' de tus datos. ';
    });
  }
  if (!DEMO) {
    const unidos = limpiarDuplicadosSeguros(S, ahora);
    if (unidos.length) { S.log.unshift({ t: ahora, texto: 'Se unieron automáticamente inquilinos duplicados: ' + unidos.join(', ') + ' (copia en la papelera)' }); avisoInicio += 'Se unieron ' + plural(unidos.length, 'inquilino duplicado', 'inquilinos duplicados') + ': ' + unidos.join(', ') + '.'; }
  }
  if (!S.sembrado) sembrarConvivencia(S);
  if (!DEMO) corregirTextosBase(S);
  guardar();
  render();
  if (avisoInicio) toast(avisoInicio.trim() + ' Nada se perdió: está en la papelera de Ajustes.');
  if (!DEMO && typeof nubeIniciar === 'function') nubeIniciar();   // la nube se conecta aparte: la app ya está lista y funciona sin ella
})();
