<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="../img/icono.svg">
<title>Casa Peñuela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Casa Peñuela — tema tomado de la plantilla de Electromandos (plantilla_em.py):
   fondo #12141C, acento índigo #8B93F8, Sora (títulos), Manrope (texto) e IBM Plex Mono (etiquetas y cifras). */
:root{
  --f-cuerpo:'Manrope',system-ui,'Segoe UI',Roboto,sans-serif;
  --f-titulo:'Sora','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --bg:#12141C; --panel:#171A24; --suave:#1D2130; --ink:#E8E9F0; --muted:#9CA0B4; --dim:#6E7389; --line:#262A3A;
  --acc:#8B93F8; --acc-ink:#12141C; --acc-soft:#232748;
  --ok:#4ADE80; --ok-soft:#12301F; --warn:#F5B14C; --warn-soft:#2B2410; --bad:#F87171; --bad-soft:#3A1A1E; --bad-ink:#12141C;
  --info:#8B93F8; --info-soft:#232748; --gris:#9CA0B4; --gris-soft:#222636;
  --grad:linear-gradient(118deg,#2E3474 0%,#4A3A85 100%);
  --sombra:0 1px 2px rgba(0,0,0,.35);
  color-scheme:dark;
}
:root[data-tema=claro]{
  --bg:#F4F3EE; --panel:#FFFFFF; --suave:#FAF9F5; --ink:#1C2430; --muted:#5F6B7A; --dim:#7B8494; --line:#E3E0D7;
  --acc:#4B52C9; --acc-ink:#FFFFFF; --acc-soft:#E4E5FB;
  --ok:#166534; --ok-soft:#DCF3E3; --warn:#9A4A07; --warn-soft:#FDEBC8; --bad:#B91C1C; --bad-soft:#FBDADA; --bad-ink:#FFFFFF;
  --info:#1D4ED8; --info-soft:#DBE6FD; --gris:#4B5563; --gris-soft:#EBE9E2;
  --sombra:0 1px 2px rgba(20,30,40,.06),0 6px 18px rgba(20,30,40,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.55 var(--f-cuerpo)}
h1,h2,h3,h4{font-family:var(--f-titulo);line-height:1.2;margin:0;color:var(--ink)}
h1{font-size:30px;font-weight:600;letter-spacing:-.015em} h2{font-size:20px;font-weight:600} h3{font-size:16.5px;font-weight:600} h4{font-size:14px;font-weight:600}
a{color:var(--acc)}
p{margin:0 0 8px}
small,.peq{font-size:12.5px;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-family:var(--f-mono)}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sep{flex:1}
.mt{margin-top:16px} .mt2{margin-top:8px}
[hidden]{display:none!important}
.etq{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.kicker{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}

/* cabecera */
.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;font-family:var(--f-titulo);font-weight:700;font-size:18px;text-decoration:none;color:var(--ink);white-space:nowrap;letter-spacing:-.01em}
.marca svg,.marca img{width:36px;height:36px;display:block;object-fit:contain}
nav{display:flex;gap:2px;flex:1;overflow-x:auto;min-width:0}
nav a{padding:8px 12px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap}
nav a:hover{background:var(--suave)}
nav a.on{background:var(--acc-soft);color:var(--acc)}
main{max-width:1200px;margin:0 auto;padding:18px 16px 80px}
.banner{max-width:1200px;margin:10px auto 0;padding:0 16px}
.banner>div{padding:10px 14px;border-radius:10px;font-weight:600;margin-bottom:6px}
.banner .btn{margin-left:8px;vertical-align:middle}
.banner .info{background:var(--info-soft);color:var(--info)}
.banner .warn{background:var(--warn-soft);color:var(--warn)}
.banner .bad{background:var(--bad-soft);color:var(--bad)}
@media (max-width:760px){
  .top-in{gap:8px}
  .top-in>.btn{margin-left:auto;order:2}
  nav{order:3;flex:1 1 100%}
}

/* botones */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:650;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--acc)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn.primario{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.peligro{background:var(--bad);border-color:var(--bad);color:var(--bad-ink)}
.btn.chico{padding:5px 10px;font-size:13.5px;border-radius:8px}
.btn.fantasma{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.enlace{background:none;border:0;padding:0;font:inherit;color:var(--acc);cursor:pointer;text-decoration:underline}

/* tarjetas */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--sombra)}
.card>h2,.card>h3{margin-bottom:10px}
.rejilla{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.rejilla.chica{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.dos{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
@media (max-width:520px){.dos{grid-template-columns:1fr}.rejilla{grid-template-columns:1fr}.rejilla.chica{grid-template-columns:1fr 1fr}.kpi{padding:12px}.kpi b{font-size:21px}.dias b{font-size:40px}}
.titulo-sec{display:flex;align-items:baseline;gap:10px;margin:28px 0 12px;flex-wrap:wrap}
.titulo-sec h2{font-size:20px;position:relative;padding-bottom:10px}
.titulo-sec h2::after{content:'';position:absolute;left:0;bottom:0;width:46px;height:2px;background:var(--acc)}
.vacio{text-align:center;padding:30px 16px;color:var(--muted)}
.vacio b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px;font-family:var(--f-titulo)}

/* chips */
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;font-family:var(--f-cuerpo)}
.chip.verde{background:var(--ok-soft);color:var(--ok)}
.chip.ambar{background:var(--warn-soft);color:var(--warn)}
.chip.rojo{background:var(--bad-soft);color:var(--bad)}
.chip.azul{background:var(--info-soft);color:var(--info)}
.chip.gris{background:var(--gris-soft);color:var(--gris)}

/* encabezado de pantalla (como el hero de las facturas) */
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.hero .logo{width:76px;height:76px;flex:none}
.hero .logo svg,.hero .logo img{width:100%;height:100%;object-fit:contain;display:block}
.hero .hoy{color:var(--muted);font-weight:500}
.hero .codigo{text-align:right}
.hero .codigo b{display:block;font-family:var(--f-titulo);font-size:22px;font-weight:700}
.kpi{padding:14px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--sombra)}
.kpi span{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:500}
.kpi b{display:block;font-family:var(--f-titulo);font-size:26px;line-height:1.25;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi small{display:block}
.kpi.rojo b{color:var(--bad)} .kpi.verde b{color:var(--ok)} .kpi.ambar b{color:var(--warn)}
.kpi.total{background:var(--grad);border-color:transparent}
.kpi.total span,.kpi.total small{color:#C7CBFF}
.kpi.total b{color:#fff}

/* tarjeta de persona */
.persona{border-left:5px solid var(--line);display:flex;flex-direction:column;gap:10px}
.persona.verde{border-left-color:var(--ok)} .persona.ambar{border-left-color:var(--warn)}
.persona.rojo{border-left-color:var(--bad)} .persona.azul{border-left-color:var(--acc)} .persona.gris{border-left-color:var(--dim)}
.persona h3 a{color:var(--ink);text-decoration:none;font-size:17px}
.persona h3 a:hover{text-decoration:underline}
.p-top{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.dias{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dias b{font-family:var(--f-titulo);font-size:46px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.dias .u{font-size:17px;font-weight:700}
.dias .y{color:var(--muted);font-weight:600}
.desde{font-size:13.5px;color:var(--muted)}
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:0}
.datos div{background:var(--suave);border-radius:9px;padding:8px 10px}
.datos dt{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.datos dd{margin:2px 0 0;font-weight:700;font-variant-numeric:tabular-nums}
.ciclo{background:var(--suave);border-radius:9px;padding:9px 11px}
.ciclo .etq{margin-bottom:4px}
.ciclo .l{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:5px;flex-wrap:wrap}

/* línea de tiempo */
.lt{overflow-x:auto}
.lt-fila{display:flex;align-items:center;gap:10px;min-width:560px;padding:5px 0}
.lt-nom{width:150px;flex:none;font-weight:650;font-size:14px;line-height:1.2}
.lt-nom small{display:block;font-weight:500;font-family:var(--f-mono);font-size:11px}
.lt-pista{position:relative;flex:1;height:26px;background:var(--suave);border-radius:7px}
.lt-pista .seg{position:absolute;top:3px;bottom:3px;border-radius:5px}
.seg.vivido{background:var(--acc)} .seg.fue{background:var(--dim)}
.seg.futuro{background:repeating-linear-gradient(90deg,var(--acc-soft) 0 6px,transparent 6px 10px);border:1px dashed var(--acc)}
.lt-pista .hoy{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--warn)}
.lt-meses{position:relative;height:18px;margin-left:160px;min-width:400px;font-size:11px;color:var(--dim);font-family:var(--f-mono)}
.lt-meses span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.leyenda i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:baseline}

/* listas */
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.lista li:last-child{border-bottom:0}
.lista .pt{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--dim)}
.pt.rojo{background:var(--bad)!important} .pt.ambar{background:var(--warn)!important} .pt.azul{background:var(--acc)!important} .pt.gris{background:var(--dim)!important} .pt.verde{background:var(--ok)!important}
.lista .cuerpo{flex:1;min-width:0}
.lista .fecha{flex:none;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);min-width:70px}

/* tablas */
.tabla-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-mono);font-size:10px;font-weight:500;color:var(--dim);text-transform:uppercase;letter-spacing:.11em;white-space:nowrap}
td.acc{white-space:nowrap;text-align:right}
tr.futuro td{color:var(--muted)}
.neg{color:var(--bad);font-weight:700} .pos{color:var(--ok);font-weight:700}

/* barra de progreso */
.barra{height:8px;background:var(--gris-soft);border-radius:99px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acc);border-radius:99px}

/* sub-navegación de convivencia */
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.subnav a{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);text-decoration:none;color:var(--ink);font-weight:650}
.subnav a.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}

/* aseo */
.zona{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.zona:last-child{border-bottom:0}
.zona .quien{flex:1;min-width:180px}
.zona .quien b,.zona .quien small,.zona .quien span{display:block}
.zona .quien span{margin-top:2px}
.racha{font-family:var(--f-titulo);font-size:38px;font-weight:700;color:var(--acc);line-height:1}

/* acuerdo y guía */
.regla{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.regla:last-child{border-bottom:0}
.regla .txt{flex:1}
.cat-t{margin:18px 0 4px;font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--acc);text-transform:uppercase;letter-spacing:.14em}
.dorada{background:var(--warn-soft);border-radius:12px;padding:12px 14px;color:var(--ink);border:1px solid rgba(245,177,76,.25)}
.cita{border-left:3px solid var(--acc);background:var(--suave);padding:12px 14px;border-radius:0 10px 10px 0;white-space:pre-wrap}
.si-no{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.si-no>div{padding:10px 12px;border-radius:10px}
.si-no .si{background:var(--ok-soft)} .si-no .no{background:var(--bad-soft)}
@media (max-width:620px){.si-no{grid-template-columns:1fr}}
details.d{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel);margin-bottom:10px}
details.d summary{cursor:pointer;font-weight:700;font-family:var(--f-titulo)}
details.d[open] summary{margin-bottom:8px}

/* formularios y diálogos */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;width:min(700px,calc(100vw - 20px));max-height:calc(100vh - 20px);background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.55)}
dialog::backdrop{background:rgba(6,8,12,.65)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 22px)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h .x{background:none;border:0;font-size:20px;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:8px}
.dlg-b{padding:16px 18px;overflow:auto}
.dlg-f{display:flex;gap:10px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.err{margin:0;padding:10px 18px;background:var(--bad-soft);color:var(--bad);font-weight:650}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-weight:650;font-size:13.5px;margin-bottom:4px}
.fld small{display:block;margin-top:3px}
input[type=text],input[type=date],input[type=month],input[type=number],input[type=search],input[type=password],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{resize:vertical}
.din{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.din i{padding:0 4px 0 12px;font-style:normal;color:var(--muted)}
.din input{border:0!important;background:transparent!important;padding-left:6px!important;font-family:var(--f-mono)!important}
.din.grande input{font-size:22px;font-weight:600;padding-top:12px;padding-bottom:12px}
.din.grande i{font-size:20px}
.dos-col{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:560px){.dos-col{grid-template-columns:1fr}}
.chk{display:flex;gap:10px;align-items:flex-start;margin:6px 0;cursor:pointer}
.chk input{margin-top:5px;width:18px;height:18px;flex:none;accent-color:var(--acc)}
.info-caja{background:var(--acc-soft);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.aviso-caja{background:var(--warn-soft);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.tarjeta-precio{background:var(--grad);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.tarjeta-precio .fld{margin:0}
.tarjeta-precio .fld>span{color:#C7CBFF;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.tarjeta-precio small{color:#C7CBFF}
.tarjeta-precio .din{background:rgba(18,20,28,.35);border-color:rgba(199,203,255,.3)}

#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:min(560px,calc(100vw - 24px));font-weight:600;display:flex;gap:12px;align-items:center}
#toast.err{background:var(--bad);color:var(--bad-ink)}
#toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:4px 10px;font:inherit;font-weight:700;cursor:pointer}

/* ============ documentos (recibo, estado de cuenta, acuerdo): plantilla de Electromandos ============ */
.doc{width:860px;background:#12141C;color:#E8E9F0;font-family:'Manrope',system-ui,sans-serif;font-size:13px;line-height:1.55;position:relative;-webkit-print-color-adjust:exact;print-color-adjust:exact;text-align:left}
.doc *{box-sizing:border-box}
.doc .m{font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace}
.doc .d-top{display:flex;justify-content:space-between;align-items:center;padding:14px 52px;border-bottom:1px solid #262A3A;font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:10px;letter-spacing:.14em;color:#6E7389;text-transform:uppercase}
.doc .d-hero{padding:46px 52px 0}
.doc .d-hero-in{display:flex;gap:34px;align-items:flex-start}
.doc .d-logo{flex-shrink:0;width:122px;height:122px}
.doc .d-logo svg,.doc .d-logo img{width:100%;height:100%;object-fit:contain;display:block}
.doc .d-kicker{font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:10px;letter-spacing:.16em;color:#8B93F8;text-transform:uppercase;margin-bottom:12px}
.doc h1{font-family:'Sora','Segoe UI',sans-serif;font-size:33px;font-weight:600;line-height:1.14;letter-spacing:-.015em;margin:0;color:#fff}
.doc .d-cod{font-family:'Sora','Segoe UI',sans-serif;font-size:25px;font-weight:700;color:#fff;letter-spacing:-.01em}
.doc .d-cod-sub{font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:10px;letter-spacing:.1em;color:#6E7389;text-transform:uppercase;margin-top:5px}
.doc .d-pad{padding:34px 52px 0}
.doc .d-partes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid #262A3A;border-radius:12px;overflow:hidden}
.doc .d-parte{padding:20px 24px}
.doc .d-parte+.d-parte{border-left:1px solid #262A3A}
.doc .d-lbl{font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:9.5px;letter-spacing:.14em;color:#6E7389;text-transform:uppercase;margin-bottom:9px}
.doc .d-nombre{font-family:'Sora','Segoe UI',sans-serif;font-size:15px;font-weight:600;color:#fff;margin-bottom:7px}
.doc .d-dato{color:#9CA0B4;font-size:12.5px;line-height:1.7}
.doc .d-franja{display:grid;background:#171A24;border-radius:12px;overflow:hidden}
.doc .d-celda{padding:16px 20px}
.doc .d-celda .d-lbl{font-size:9px;letter-spacing:.13em;margin-bottom:6px}
.doc .d-val{font-size:13px;color:#E8E9F0;font-weight:600}
.doc h2{font-family:'Sora','Segoe UI',sans-serif;font-size:19px;font-weight:600;color:#fff;margin:0 0 4px}
.doc .d-barra{height:2px;width:46px;background:#8B93F8;margin-bottom:22px}
.doc .d-thead,.doc .d-fila{display:grid;grid-template-columns:96px 1fr 104px 104px 112px}

<script>
/* Casa Peñuela — versión 4.0 — construida el 2026-10-30 */
/* ===========================================================================
   Casa Peñuela — datos de la versión PÚBLICA de la app (la que se publica en internet).
   Aquí NO hay ningún dato de David ni de los inquilinos: ni nombres, ni cédula, ni dirección, ni teléfonos, ni firma.
   Los datos reales viven en la nube de David (Firestore) y solo se ven después de entrar con su cuenta de Google.
   =========================================================================== */
const PERFIL_DUENO = { casa: 'Casa Peñuela' };
const PAGOS_INICIALES = [];
const PERSONAS_RETIRADAS = [];
const TAREAS_HECHAS_INICIALES = [];
const PERSONAS_INICIALES = [];

/* ===========================================================================
   Mi Casa — lógica pura (sin pantalla).
   Se prueba con node (pruebas/logica.test.mjs) y se incrusta en ENTREGA/Mi_Casa.html.
   Todas las fechas son texto 'AAAA-MM-DD'. Nada aquí toca el DOM.
   =========================================================================== */

const MS_DIA = 86400000;
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const MES3 = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const DIAS_SEM = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

/* ---------- fechas ---------- */
function p2(n) { return String(n).padStart(2, '0'); }
function aMs(s) { const a = s.split('-'); return Date.UTC(+a[0], +a[1] - 1, +a[2]); }
function deMs(ms) { const d = new Date(ms); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()); }
function dif(a, b) { return Math.round((aMs(a) - aMs(b)) / MS_DIA); }          // a - b en días
function sumarDias(s, n) { return deMs(aMs(s) + n * MS_DIA); }
function diasDelMes(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }  // m = 1..12
function sumarMeses(s, n) {
  const a = s.split('-'); const y = +a[0], m = +a[1], d = +a[2];
  const t = y * 12 + (m - 1) + n; const ny = Math.floor(t / 12), nm = (t % 12) + 1;
  return ny + '-' + p2(nm) + '-' + p2(Math.min(d, diasDelMes(ny, nm)));
}
function mx(a, b) { return a > b ? a : b; }
function mn(a, b) { return a < b ? a : b; }
function diaSemana(s) { return new Date(aMs(s)).getUTCDay(); }
function lunesDe(s) { return sumarDias(s, -((diaSemana(s) + 6) % 7)); }
function indiceSemana(lunes) { return Math.floor(dif(lunes, '2024-01-01') / 7); }  // 2024-01-01 fue lunes
function esFecha(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(aMs(s)); }

/* ---------- formato ---------- */
function fCorta(s) { const a = s.split('-'); return +a[2] + ' ' + MES3[+a[1] - 1] + ' ' + a[0]; }
function fSinAnio(s) { const a = s.split('-'); return +a[2] + ' ' + MES3[+a[1] - 1]; }
function fLarga(s) { const a = s.split('-'); return DIAS_SEM[diaSemana(s)] + ' ' + +a[2] + ' de ' + MESES[+a[1] - 1] + ' de ' + a[0]; }
function fMes(s) { const a = s.split('-'); return MESES[+a[1] - 1] + ' ' + a[0]; }
function fmtNum(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function pesos(n) { return (n < 0 ? '-' : '') + '$' + fmtNum(Math.abs(n)); }
function plural(n, uno, varios) { return n + ' ' + (n === 1 ? uno : varios); }
function enDias(n) {
  if (n === 0) return 'hoy';
  if (n === 1) return 'mañana';
  if (n === -1) return 'ayer';
  return n > 0 ? 'en ' + n + ' días' : 'hace ' + (-n) + ' días';
}
function textoDuracion(anios, meses, dias) {
  const p = [];
  if (anios) p.push(plural(anios, 'año', 'años'));
  if (meses) p.push(plural(meses, 'mes', 'meses'));
  if (dias) p.push(plural(dias, 'día', 'días'));
  if (!p.length) return '0 días';
  if (p.length === 1) return p[0];
  return p.slice(0, -1).join(', ') + ' y ' + p[p.length - 1];
}
function textoMeses(m) {
  const a = Math.floor(m / 12), r = m % 12;
  return textoDuracion(a, r, 0);
}
function apocope(s) { return s.replace(/veintiuno$/, 'veintiún').replace(/uno$/, 'un'); }
function numeroALetras(n) {
  n = Math.floor(Math.abs(n));
  if (n === 0) return 'cero pesos';
  const U = ['', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciséis', 'diecisiete', 'dieciocho', 'diecinueve', 'veinte', 'veintiuno', 'veintidós', 'veintitrés', 'veinticuatro', 'veinticinco', 'veintiséis', 'veintisiete', 'veintiocho', 'veintinueve'];
  const D = ['', '', '', 'treinta', 'cuarenta', 'cincuenta', 'sesenta', 'setenta', 'ochenta', 'noventa'];
  const C = ['', 'ciento', 'doscientos', 'trescientos', 'cuatrocientos', 'quinientos', 'seiscientos', 'setecientos', 'ochocientos', 'novecientos'];
  const c3 = x => {
    if (x === 100) return 'cien';
    const c = Math.floor(x / 100), r = x % 100; let s = C[c];
    if (r) { if (s) s += ' '; s += r < 30 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ' y ' + U[r % 10] : ''); }
    return s;
  };
  const miles = x => {
    const m = Math.floor(x / 1000), r = x % 1000; let s = '';
    if (m) s = m === 1 ? 'mil' : apocope(c3(m)) + ' mil';
    if (r) s += (s ? ' ' : '') + c3(r);
    return s;
  };
  const mill = Math.floor(n / 1e6), resto = n % 1e6; let s = '';
  if (mill) s = mill === 1 ? 'un millón' : apocope(miles(mill)) + ' millones';
  if (resto) s += (s ? ' ' : '') + miles(resto); else if (mill) s += ' de';
  return apocope(s) + (n === 1 ? ' peso' : ' pesos');
}
function mayuscula1(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

/* ---------- estado base ---------- */
const CLAVES_LISTA = ['personas', 'cargos', 'pagos', 'facturas', 'reglas', 'compromisos', 'zonas', 'eventos', 'cosas', 'prestamos', 'novedades', 'gastos', 'papelera', 'log'];
function estadoVacio() {
  return {
    v: 2,
    cfg: Object.assign({ casa: 'Casa Peñuela', dueno: '', duenoCompleto: '', documento: '', direccion: '', ciudad: 'Bucaramanga', telefonos: '', correo: '', logo: '', firma: '', tema: 'oscuro', serviciosIncluidos: true, qrs: [], semillaPersonas: '', semillasAplicadas: [], perfilEditado: false, informeCorreo: '', informeWhatsApp: '', envio: { servicio: '', url: '', clave: '' }, redondeo: 100, gracia: 0, datosPago: '', ultimoRespaldo: null, aseoDia: 0, aseoDueno: true, aseoInicio: null, proximaReunion: null },
      typeof PERFIL_DUENO !== 'undefined' ? PERFIL_DUENO : {}, typeof FIRMA_INICIAL !== 'undefined' ? { firma: FIRMA_INICIAL } : {}),
    personas: [], cargos: [], pagos: [], facturas: [],
    reglas: [], compromisos: [], acuerdoVersion: 1,
    zonas: [], aseo: {}, eventos: [], cosas: [], prestamos: [], novedades: [], gastos: [], papelera: [],
    log: [], seq: { recibo: 0 }, sembrado: false
  };
}
function normalizar(s) {
  const base = estadoVacio();
  const o = Object.assign(base, s || {});
  o.cfg = Object.assign(estadoVacio().cfg, (s && s.cfg) || {});
  // Mientras David no guarde sus Ajustes, los datos de datos_casa.js rellenan lo que esté vacío (por si abrió una versión vieja antes).
  if (typeof PERFIL_DUENO !== 'undefined' && !o.cfg.perfilEditado) {
    ['casa', 'dueno', 'duenoCompleto', 'documento', 'direccion', 'ciudad'].forEach(k => { if (!o.cfg[k] && PERFIL_DUENO[k]) o.cfg[k] = PERFIL_DUENO[k]; });
    if (o.cfg.ciudad === 'Bucaramanga' && PERFIL_DUENO.ciudad) o.cfg.ciudad = PERFIL_DUENO.ciudad;   // 'Bucaramanga' era el valor por defecto de la versión vieja
    if (!o.cfg.firma && typeof FIRMA_INICIAL !== 'undefined') o.cfg.firma = FIRMA_INICIAL;
  }
  o.seq = Object.assign({ recibo: 0 }, (s && s.seq) || {});
  o.cfg.envio = Object.assign({ servicio: '', url: '', clave: '' }, o.cfg.envio || {});
  if (!Array.isArray(o.cfg.semillasAplicadas)) o.cfg.semillasAplicadas = [];
  CLAVES_LISTA.forEach(k => { if (!Array.isArray(o[k])) o[k] = []; });
  if (!o.aseo || typeof o.aseo !== 'object' || Array.isArray(o.aseo)) o.aseo = {};
  o.personas.forEach(p => {
    p.deposito = Object.assign({ acordado: 0, recibido: 0, devuelto: 0 }, p.deposito || {});
    if (!Array.isArray(p.lista)) p.lista = [];
    if (!Array.isArray(p.precios)) p.precios = [];
    if (p.acuerdo === undefined) p.acuerdo = null;
  });
  return o;
}

/* ---------- tiempo en la casa ---------- */
function tiempoVivido(p, hoy) {
  if (hoy < p.ingreso) return { estado: 'porLlegar', faltan: dif(p.ingreso, hoy), dias: 0 };
  const salio = !!(p.salida && p.salida <= hoy);
  const fin = salio ? p.salida : hoy;
  const dias = dif(fin, p.ingreso);
  let meses = 0;
  while (sumarMeses(p.ingreso, meses + 1) <= fin) meses++;
  const resto = dif(fin, sumarMeses(p.ingreso, meses));
  return { estado: salio ? 'salio' : 'activo', dias, mesesTotal: meses, anios: Math.floor(meses / 12), meses: meses % 12, resto, fin, desde: p.ingreso, texto: textoDuracion(Math.floor(meses / 12), meses % 12, resto) };
}
/* Dónde va la persona dentro de su periodo de cobro actual: "día 9 de 31, faltan 23 para que cierre". */
function cicloActual(p, hoy) {
  const t = tiempoVivido(p, hoy); if (t.estado !== 'activo') return null;
  const pe = periodosDe(p, hoy).filter(x => x.ini <= hoy && hoy < x.fin).pop(); if (!pe) return null;
  const total = dif(pe.fin, pe.ini), dia = dif(hoy, pe.ini) + 1;
  return { ini: pe.ini, fin: pe.fin, dia, total, faltan: dif(pe.fin, hoy), pct: Math.min(100, Math.round(dia / total * 100)), calendario: p.ciclo === 'calendario' };
}
function proximoHito(p, t) {
  if (t.estado !== 'activo') return null;
  const m = t.mesesTotal + 1;
  const fecha = sumarMeses(p.ingreso, m);
  if (p.salida && fecha > p.salida) return null;
  return { meses: m, fecha, texto: textoMeses(m) };
}

/* ---------- cobro por reglas ---------- */
function precioEn(p, fecha) {
  const ps = (p.precios || []).slice().sort((a, b) => a.desde < b.desde ? -1 : a.desde > b.desde ? 1 : 0);
  let v = ps.length ? ps[0].monto : 0;
  for (const x of ps) if (x.desde <= fecha) v = x.monto;
  return v;
}
function redondear(x, u) { u = u || 1; return Math.round(x / u) * u; }

function periodosDe(p, limite) {
  const out = []; const sal = p.salida || '9999-12-31';
  if (p.ciclo === 'calendario') {
    let y = +p.ingreso.slice(0, 4), m = +p.ingreso.slice(5, 7);
    for (let i = 0; i < 720; i++) {
      const nIni = y + '-' + p2(m) + '-01'; const nFin = sumarMeses(nIni, 1);
      const ini = mx(nIni, p.ingreso), fin = mn(nFin, sal);
      if (ini > limite || ini >= sal) break;
      out.push({ nIni, nFin, ini, fin, primero: i === 0, y, m });
      m++; if (m > 12) { m = 1; y++; }
    }
  } else {
    for (let k = 0; k < 720; k++) {
      const ini = sumarMeses(p.ingreso, k);
      if (ini > limite || ini >= sal) break;
      const nFin = sumarMeses(p.ingreso, k + 1);
      out.push({ nIni: ini, nFin, ini, fin: mn(nFin, sal), primero: k === 0 });
    }
  }
  return out;
}

function cargosRenta(p, cfg, limite) {
  const u = cfg.redondeo || 1; const out = [];
  for (const pe of periodosDe(p, limite)) {
    const dias = dif(pe.fin, pe.ini); if (dias <= 0) continue;
    const natural = dif(pe.nFin, pe.nIni);
    const precio = precioEn(p, pe.ini);
    let monto, parcial = false;
    if (p.unidad === 'dia') monto = precio * dias;
    else {
      let completo = dias === natural;
      if (!completo && p.ciclo === 'calendario' && p.primerMes === 'completo' && pe.primero && pe.fin === pe.nFin) completo = true;
      if (completo) monto = precio; else { monto = redondear(precio * dias / natural, u); parcial = true; }
    }
    if (monto <= 0) continue;

    if (p.ciclo === 'calendario') {
      const dp = Math.max(1, Math.min(31, +p.diaPago || 1));

      if (p.momento === 'vencido') {
        due = dpf(+pe.nFin.slice(0, 4), +pe.nFin.slice(5, 7));
        if (p.salida) due = mn(due, p.salida);
        due = mx(due, pe.ini);
      } else due = mx(dpf(pe.y, pe.m), pe.ini);
    } else due = p.momento === 'vencido' ? pe.fin : pe.ini;
    if (p.cuentaDesde && due < p.cuentaDesde) continue;   // lo anterior se dio por pagado
    let concepto;
    const hasta = sumarDias(pe.fin, -1);

    else if (p.ciclo === 'calendario') concepto = 'Arriendo de ' + MESES[+pe.nIni.slice(5, 7) - 1] + ' ' + pe.nIni.slice(0, 4) + (parcial ? ' (' + dias + ' de ' + natural + ' días)' : '');
    else concepto = 'Arriendo del ' + fSinAnio(pe.ini) + ' al ' + fSinAnio(hasta) + (parcial ? ' (' + dias + ' de ' + natural + ' días)' : '');
    out.push({ id: 'r:' + p.id + ':' + pe.ini, personaId: p.id, fecha: due, concepto, monto, tipo: 'arriendo', origen: 'regla', parcial, periodo: { ini: pe.ini, fin: pe.fin } });
  }
  return out;
}

/* ---------- servicios (luz, agua, internet...) repartidos por días vividos ---------- */
function repartoFactura(S, f) {
  const u = S.cfg.redondeo || 1;
  const hastaEx = sumarDias(f.hasta, 1);
  const totalDias = Math.max(1, dif(hastaEx, f.desde));
  const partes = [];
  for (const id of f.personas || []) {
    const p = S.personas.find(x => x.id === id); if (!p) continue;
    const a = mx(f.desde, p.ingreso), b = mn(hastaEx, p.salida || '9999-12-31');
    const dias = Math.max(0, dif(b, a));
    partes.push({ personaId: id, nombre: p.nombre, dias, peso: f.reparto === 'iguales' ? (dias > 0 ? 1 : 0) : dias, monto: 0 });
  }
  let dueno = null;
  if (f.incluirDueno) dueno = { dias: totalDias, peso: f.reparto === 'iguales' ? 1 : totalDias, monto: 0 };
  const suma = partes.reduce((s, x) => s + x.peso, 0) + (dueno ? dueno.peso : 0);
  if (suma > 0) {
    let asignado = 0;
    for (const x of partes) { x.monto = redondear(f.total * x.peso / suma, u); asignado += x.monto; }
    if (dueno) { dueno.monto = redondear(f.total * dueno.peso / suma, u); asignado += dueno.monto; }
    const resto = f.total - asignado;
    if (resto !== 0) {
      const obj = dueno || partes.reduce((m, x) => (!m || x.monto > m.monto) ? x : m, null);
      if (obj) obj.monto += resto;
    }
  }
  return { partes, dueno, totalDias, repartido: partes.reduce((s, x) => s + x.monto, 0) };
}

function cmpFecha(a, b) { return a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : (a.id < b.id ? -1 : a.id > b.id ? 1 : 0); }

function cargosPersona(S, p, limite) {
  const arr = cargosRenta(p, S.cfg, limite);
  for (const c of S.cargos) if (c.personaId === p.id) arr.push(Object.assign({}, c, { tipo: 'otro', origen: 'manual' }));
  for (const f of S.facturas) {
    if (!(f.personas || []).includes(p.id)) continue;
    const r = repartoFactura(S, f); const x = r.partes.find(y => y.personaId === p.id);
    if (x && x.monto > 0) arr.push({ id: 'f:' + f.id + ':' + p.id, personaId: p.id, fecha: f.cobrarEl, concepto: f.concepto + ' (' + x.dias + ' de ' + r.totalDias + ' días · ' + fSinAnio(f.desde) + ' al ' + fSinAnio(f.hasta) + ')', monto: x.monto, tipo: 'servicio', origen: 'factura', facturaId: f.id });
  }
  return arr.sort(cmpFecha);
}

/* ---------- estado de cuenta: los pagos cubren primero lo más viejo ---------- */
function estadoCuenta(S, p, hoy, limite) {
  limite = limite || sumarDias(hoy, 45);
  const cargos = cargosPersona(S, p, limite);
  const creditos = S.pagos.filter(x => x.personaId === p.id).slice().sort(cmpFecha);
  const credHoy = creditos.filter(x => x.fecha <= hoy);
  const totalCreditos = credHoy.reduce((s, x) => s + x.monto, 0);
  let resto = totalCreditos;
  const gracia = S.cfg.gracia || 0;
  for (const c of cargos) {
    c.pagado = Math.min(resto, c.monto); resto -= c.pagado; c.pendiente = c.monto - c.pagado;
    if (c.pendiente <= 0) c.estado = 'pagado';
    else if (c.fecha > hoy) c.estado = c.pagado > 0 ? 'parcial' : 'proximo';
    else if (hoy > sumarDias(c.fecha, gracia)) c.estado = 'vencido';
    else c.estado = 'porPagar';
  }
  const cargosHoy = cargos.filter(c => c.fecha <= hoy);
  const deuda = cargosHoy.reduce((s, c) => s + c.pendiente, 0);
  const vencido = cargos.filter(c => c.estado === 'vencido').reduce((s, c) => s + c.pendiente, 0);
  const proximo = cargos.find(c => c.fecha > hoy && c.pendiente > 0) || null;
  const ev = [];
  cargosHoy.forEach(c => ev.push({ k: 'cargo', fecha: c.fecha, c }));
  credHoy.forEach(x => ev.push({ k: 'pago', fecha: x.fecha, x }));
  ev.sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : (a.k === b.k ? 0 : a.k === 'cargo' ? -1 : 1));
  let saldo = 0;
  for (const e of ev) { saldo += e.k === 'cargo' ? e.c.monto : -e.x.monto; e.saldo = saldo; }
  const totalCargado = cargosHoy.reduce((s, c) => s + c.monto, 0);
  return { cargos, cargosHoy, proximos: cargos.filter(c => c.fecha > hoy), deuda, vencido, proximo, aFavor: resto, libro: ev, totalCargado, totalPagado: credHoy.filter(x => x.tipo !== 'descuento').reduce((s, x) => s + x.monto, 0), totalDescuentos: credHoy.filter(x => x.tipo === 'descuento').reduce((s, x) => s + x.monto, 0) };
}

/* Cómo se llama un movimiento a favor de la persona: pago recibido, descuento, o abono por compensación (p. ej. un trabajo que ella le hizo al dueño). */
function etiquetaCredito(x) { return x.tipo === 'descuento' ? (x.metodo === 'Compensación' ? 'Abono por compensación' : 'Descuento') : 'Pago'; }
function detalleCredito(x) { return etiquetaCredito(x) + (x.metodo && x.metodo !== 'Compensación' ? ' · ' + x.metodo : ''); }
function custodia(p) { return (p.deposito.recibido || 0) - (p.deposito.devuelto || 0); }

function resumenPersona(S, p, hoy) {
  const t = tiempoVivido(p, hoy), c = estadoCuenta(S, p, hoy);
  let nivel, etiqueta;
  if (t.estado === 'porLlegar') { nivel = 'azul'; etiqueta = 'Llega ' + enDias(t.faltan); }
  else if (t.estado === 'salio') {
    if (c.deuda > 0) { nivel = 'rojo'; etiqueta = 'Se fue y debe ' + pesos(c.deuda); }
    else if (custodia(p) > 0 || (p.lista || []).some(x => x.tipo === 'salida' && !x.hecho)) { nivel = 'ambar'; etiqueta = 'Se fue · pendientes'; }
    else { nivel = 'gris'; etiqueta = 'Se fue · cerrado'; }
  }
  else if (c.vencido > 0) { nivel = 'rojo'; etiqueta = 'Vencido ' + pesos(c.vencido); }
  else if (c.deuda > 0) { nivel = 'ambar'; etiqueta = 'Por pagar ' + pesos(c.deuda); }
  else { nivel = 'verde'; etiqueta = 'Al día'; }
  return { p, t, c, nivel, etiqueta };
}

/* ---------- aseo: rotación semanal ---------- */
function participantesAseo(S, lunes) {
  const fin = sumarDias(lunes, 7);
  const lista = S.personas.filter(p => p.ingreso < fin && (!p.salida || p.salida > lunes))
    .sort((a, b) => a.ingreso < b.ingreso ? -1 : a.ingreso > b.ingreso ? 1 : (a.id < b.id ? -1 : 1))
    .map(p => ({ id: p.id, nombre: p.nombre }));
  if (S.cfg.aseoDueno) lista.unshift({ id: 'dueno', nombre: S.cfg.dueno || 'Yo' });
  return lista;
}
function limiteAseo(S, lunes) { return sumarDias(lunes, ((S.cfg.aseoDia || 0) + 6) % 7); }
function aseoSemana(S, lunes, hoy) {
  const parts = participantesAseo(S, lunes); const idx = indiceSemana(lunes); const lim = limiteAseo(S, lunes);
  return S.zonas.map((z, i) => {
    const part = parts.length ? parts[((idx + i) % parts.length + parts.length) % parts.length] : null;
    const clave = lunes + ':' + z.id; const hecho = S.aseo[clave] || null;
    let estado = hecho ? 'hecho' : (hoy > lim ? 'atrasado' : 'pendiente');
    return { zona: z, part, clave, hecho, estado, limite: lim };
  });
}
function semanaCompleta(S, lunes) {
  if (!S.zonas.length) return false;
  return S.zonas.every(z => S.aseo[lunes + ':' + z.id]);
}
function rachaAseo(S, hoy) {
  if (!S.zonas.length || !S.cfg.aseoInicio) return 0;
  const inicio = lunesDe(S.cfg.aseoInicio); const actual = lunesDe(hoy);
  let racha = semanaCompleta(S, actual) ? 1 : 0;
  for (let l = sumarDias(actual, -7); l >= inicio; l = sumarDias(l, -7)) { if (semanaCompleta(S, l)) racha++; else break; }
  return racha;
}
function aseoHechosPorPersona(S, hoy, semanas) {
  const desde = sumarDias(lunesDe(hoy), -7 * ((semanas || 8) - 1)); const out = {};
  for (const k of Object.keys(S.aseo)) { const lun = k.slice(0, 10); if (lun >= desde) { const por = S.aseo[k].por; out[por] = (out[por] || 0) + 1; } }
  return out;
}

/* ---------- fiestas / eventos ---------- */
function resumenEvento(e, hoy) {
  const f = fase => (e.tareas || []).filter(t => t.fase === fase);
  const falta = fase => f(fase).filter(t => !t.hecho).length;
  return { dias: dif(e.fecha, hoy), antes: f('antes'), durante: f('durante'), despues: f('despues'), faltaAntes: falta('antes'), faltaDespues: falta('despues'), total: (e.tareas || []).length, hechas: (e.tareas || []).filter(t => t.hecho).length };
}

/* ---------- pendientes: lo que no se puede quedar en el aire ---------- */
const ORDEN_NIVEL = { rojo: 0, ambar: 1, azul: 2, gris: 3 };
function pendientes(S, hoy) {
  const out = [];
  const add = (nivel, texto, ir, orden) => out.push({ nivel, texto, ir: ir || '', orden: orden || 0 });
  for (const p of S.personas) {
    const r = resumenPersona(S, p, hoy), t = r.t, c = r.c, nom = p.nombre, ir = '#/persona/' + p.id;
    if (t.estado !== 'porLlegar') {
      if (c.vencido > 0) {
        const venc = c.cargos.filter(x => x.estado === 'vencido'); const desde = venc[0].fecha;
        add('rojo', nom + ' debe ' + pesos(c.vencido) + ' (vencido desde el ' + fCorta(desde) + ', ' + enDias(dif(desde, hoy)) + ')', ir, dif(desde, hoy));
      } else if (c.deuda > 0) {
        const pend = c.cargosHoy.filter(x => x.pendiente > 0);
        add('ambar', nom + ': le toca pagar ' + pesos(c.deuda) + ' (' + (pend[0].fecha === hoy ? 'vence hoy' : 'venció el ' + fCorta(pend[0].fecha)) + ')', ir, 0);
      } else if (t.estado === 'activo' && c.proximo) {
        const d = dif(c.proximo.fecha, hoy);
        if (d <= 7) add('ambar', nom + ': su próximo pago de ' + pesos(c.proximo.pendiente) + ' es ' + enDias(d) + ' (' + fCorta(c.proximo.fecha) + ')', ir, d);
      }
    }
    if (t.estado === 'porLlegar' && t.faltan <= 30) add('azul', nom + ' llega ' + enDias(t.faltan) + ' (' + fCorta(p.ingreso) + ')', ir, t.faltan);
    if (p.ingresoProvisional && t.estado !== 'salio') add('ambar', 'Falta confirmar el día en que llega ' + nom + ' (por ahora aparece el ' + fCorta(p.ingreso) + ')', ir, 3);
    if (t.estado !== 'salio' && (p.deposito.acordado || 0) > (p.deposito.recibido || 0) && !(t.estado === 'porLlegar' && t.faltan > 14))
      add('ambar', 'Falta el depósito de ' + nom + ': ' + pesos(p.deposito.acordado - p.deposito.recibido), ir, 5);
    if (S.reglas.length && t.estado !== 'salio' && (t.estado === 'activo' || t.faltan <= 14)) {
      if (!p.acuerdo) add('ambar', nom + ' aún no ha aceptado el acuerdo de la casa', '#/conv/acuerdo', 6);
      else if (p.acuerdo.version < S.acuerdoVersion) add('ambar', nom + ' debe volver a aceptar el acuerdo (cambió desde la última vez)', '#/conv/acuerdo', 6);
    }
    const ent = (p.lista || []).filter(x => x.tipo === 'entrada' && !x.hecho);
    if (ent.length && (t.estado === 'activo' || (t.estado === 'porLlegar' && t.faltan <= 7))) add('ambar', nom + ': faltan ' + ent.length + ' cosas de su ingreso (' + ent.map(x => x.texto).join(', ') + ')', ir, 7);
    const sal = (p.lista || []).filter(x => x.tipo === 'salida' && !x.hecho);
    if (sal.length && p.salida && dif(p.salida, hoy) <= 14) add('ambar', nom + ': faltan ' + sal.length + ' cosas de su salida (' + sal.map(x => x.texto).join(', ') + ')', ir, 7);
    if (t.estado === 'salio' && custodia(p) > 0) {
      const neto = custodia(p) - c.deuda;
      add('ambar', 'Devolver el depósito de ' + nom + ': tiene ' + pesos(custodia(p)) + ' en custodia' + (c.deuda > 0 ? ' (descontando lo que debe, quedan ' + pesos(Math.max(0, neto)) + ')' : ''), ir, 8);
    }
  }
  const porCuarto = {};
  for (const p of S.personas) {
    if (tiempoVivido(p, hoy).estado === 'salio') continue;
    const k = (p.cuarto || '').toLowerCase().replace(/habitaci[oó]n|hab\.?|cuarto|#/g, '').replace(/\s+/g, ''); if (!k) continue;
    (porCuarto[k] = porCuarto[k] || []).push(p);
  }
  for (const k of Object.keys(porCuarto)) if (porCuarto[k].length > 1) add('azul', porCuarto[k].map(x => x.nombre).join(' y ') + ' aparecen en la misma habitación (' + porCuarto[k][0].cuarto + '). Si la comparten, todo bien; si no, revisa el número.', '#/persona/' + porCuarto[k][0].id, 15);
  for (const pr of S.prestamos) {
    if (pr.devuelto) continue; const d = dif(hoy, pr.fecha);
    const p = S.personas.find(x => x.id === pr.personaId); const quien = p ? p.nombre : 'alguien';
    const salio = p && p.salida && p.salida <= hoy;
    if (salio) add('rojo', quien + ' se fue y no ha devuelto: ' + pr.cosa, '#/conv/cosas', 0);
    else if (d >= 14 && pr.tipo !== 'entrega') add('ambar', quien + ' tiene prestado «' + pr.cosa + '» hace ' + d + ' días', '#/conv/cosas', 10);
  }
  for (const n of S.novedades) {
    if (n.estado === 'resuelta') continue;
    add(n.tipo === 'Faltante' ? 'rojo' : 'ambar', 'Novedad abierta (' + n.tipo.toLowerCase() + '): ' + n.texto, '#/conv/cosas', 1);
  }
  if (S.zonas.length && S.cfg.aseoInicio) {
    const lunes = lunesDe(hoy); const lim = limiteAseo(S, lunes);
    const filas = aseoSemana(S, lunes, hoy).filter(x => x.estado !== 'hecho');
    if (filas.length && hoy > lim) add('rojo', 'Aseo atrasado: falta ' + filas.map(x => x.zona.nombre + (x.part ? ' (' + x.part.nombre + ')' : '')).join(', '), '#/conv/aseo', 0);
    else if (filas.length && dif(lim, hoy) <= 1) add('ambar', 'Aseo de esta semana: falta ' + filas.map(x => x.zona.nombre + (x.part ? ' (' + x.part.nombre + ')' : '')).join(', ') + ' — se cierra ' + enDias(dif(lim, hoy)), '#/conv/aseo', 2);
  }
  for (const e of S.eventos) {
    if (e.cerrado) continue; const r = resumenEvento(e, hoy);
    if (r.dias >= 0 && r.dias <= 7 && r.faltaAntes > 0) add('ambar', e.nombre + ' es ' + enDias(r.dias) + ': faltan ' + r.faltaAntes + ' cosas por preparar', '#/conv/fiestas', r.dias);
    if (r.dias < 0 && r.faltaDespues > 0) add('rojo', 'Después de «' + e.nombre + '» falta por hacer: ' + r.faltaDespues + ' tareas', '#/conv/fiestas', r.dias);
    else if (r.dias <= 0 && r.dias > -3 && r.faltaDespues === 0 && r.total > 0) add('gris', 'Ya se puede cerrar «' + e.nombre + '»: todo quedó hecho', '#/conv/fiestas', 20);
  }
  if (S.cfg.proximaReunion) {
    const d = dif(S.cfg.proximaReunion, hoy);
    if (d < 0) add('ambar', 'La reunión de casa quedó pendiente (era ' + fCorta(S.cfg.proximaReunion) + '): programa la siguiente', '#/conv/guia', 12);
    else if (d <= 3) add('azul', 'Reunión de casa ' + enDias(d) + ' (' + fCorta(S.cfg.proximaReunion) + ')', '#/conv/guia', d);
  }
  return out.sort((a, b) => ORDEN_NIVEL[a.nivel] - ORDEN_NIVEL[b.nivel] || a.orden - b.orden);
}

/* ---------- agenda de los próximos días ---------- */
function agenda(S, hoy, dias) {
  const fin = sumarDias(hoy, dias); const ev = [];
  for (const p of S.personas) {
    const t = tiempoVivido(p, hoy);
    if (t.estado === 'porLlegar' && p.ingreso <= fin) ev.push({ fecha: p.ingreso, tipo: 'llegada', texto: p.nombre + ' llega a la casa', id: p.id });
    if (p.salida && p.salida > hoy && p.salida <= fin) ev.push({ fecha: p.salida, tipo: 'salida', texto: p.nombre + ' se va de la casa', id: p.id });
    if (t.estado !== 'salio') {
      const c = estadoCuenta(S, p, hoy, fin);
      for (const x of c.cargos) if (x.fecha > hoy && x.fecha <= fin && x.pendiente > 0) ev.push({ fecha: x.fecha, tipo: 'cobro', texto: p.nombre + ' paga ' + pesos(x.pendiente) + ' (' + x.concepto.split(' (')[0] + ')', id: p.id });
      const h = proximoHito(p, t);
      if (h && h.fecha <= fin && (h.meses === 1 || h.meses === 3 || h.meses % 6 === 0)) ev.push({ fecha: h.fecha, tipo: 'hito', texto: p.nombre + ' cumple ' + h.texto + ' en la casa', id: p.id });
    }
  }
  for (const e of S.eventos) if (!e.cerrado && e.fecha >= hoy && e.fecha <= fin) ev.push({ fecha: e.fecha, tipo: 'fiesta', texto: e.nombre, id: e.id });
  if (S.cfg.proximaReunion && S.cfg.proximaReunion >= hoy && S.cfg.proximaReunion <= fin) ev.push({ fecha: S.cfg.proximaReunion, tipo: 'reunion', texto: 'Reunión de casa', id: '' });
  if (S.zonas.length && S.cfg.aseoInicio) {
    const lim = limiteAseo(S, lunesDe(hoy));
    if (lim >= hoy && lim <= fin) ev.push({ fecha: lim, tipo: 'aseo', texto: 'Cierra el aseo de la semana', id: '' });
  }
  return ev.sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
}

/* ---------- totales del inicio ---------- */
function totales(S, hoy) {
  let porCobrar = 0, vencido = 0, esperadoMes = 0, prox30 = 0;
  const mesIni = hoy.slice(0, 8) + '01', mesFin = sumarMeses(mesIni, 1);
  for (const p of S.personas) {
    const c = estadoCuenta(S, p, hoy, sumarDias(hoy, 45));
    porCobrar += c.deuda; vencido += c.vencido;
    for (const x of c.cargos) {
      if (x.fecha >= mesIni && x.fecha < mesFin) esperadoMes += x.monto;
      if (x.fecha > hoy && x.fecha <= sumarDias(hoy, 30)) prox30 += x.pendiente;
    }
  }
  const cobradoMes = S.pagos.filter(x => x.tipo !== 'descuento' && x.fecha >= mesIni && x.fecha < mesFin && x.fecha <= hoy).reduce((s, x) => s + x.monto, 0);
  return { porCobrar, vencido, esperadoMes, cobradoMes, prox30 };
}

/* ---------- línea de tiempo de la casa ---------- */
function lineaTiempo(S, hoy) {
  if (!S.personas.length) return null;
  let ini = hoy, fin = hoy;
  for (const p of S.personas) {
    if (p.ingreso < ini) ini = p.ingreso;
    if (p.ingreso > fin) fin = p.ingreso;
    if (p.salida && p.salida > fin) fin = p.salida;
  }
  ini = sumarDias(ini, -7); fin = sumarDias(fin, 30);
  const total = dif(fin, ini); const pct = f => Math.max(0, Math.min(100, dif(f, ini) / total * 100));
  const filas = S.personas.slice().sort((a, b) => a.ingreso < b.ingreso ? -1 : 1).map(p => {
    const t = tiempoVivido(p, hoy); const segs = [];
    if (t.estado === 'porLlegar') segs.push({ tipo: 'futuro', a: pct(p.ingreso), b: pct(p.salida || fin) });
    else {
      segs.push({ tipo: t.estado === 'salio' ? 'fue' : 'vivido', a: pct(p.ingreso), b: pct(t.fin) });
      if (t.estado === 'activo') segs.push({ tipo: 'futuro', a: pct(hoy), b: pct(p.salida || fin) });
    }
    return { p, t, segs };
  });
  const meses = []; let m = sumarMeses(ini.slice(0, 8) + '01', 1);
  while (m < fin) { meses.push({ pct: pct(m), texto: MES3[+m.slice(5, 7) - 1] + (m.slice(5, 7) === '01' ? ' ' + m.slice(0, 4) : '') }); m = sumarMeses(m, 1); }
  return { ini, fin, hoyPct: pct(hoy), filas, meses };
}

/* ---------- inquilinos duplicados: encontrar, unir y dejar copia en la papelera ---------- */
function nuevoId() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }
function normNombre(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim(); }
function normTel(s) { const d = String(s || '').replace(/\D/g, ''); return d.length >= 7 ? d.slice(-10) : ''; }
function movimientosDe(S, id) {
  return { pagos: S.pagos.filter(x => x.personaId === id).length, cargos: S.cargos.filter(x => x.personaId === id).length, prestamos: S.prestamos.filter(x => x.personaId === id).length, cosas: S.cosas.filter(x => x.responsableId === id).length };
}
function totalMovimientos(m) { return m.pagos + m.cargos + m.prestamos + m.cosas; }
/* Grupos de personas que parecen la misma. «seguro» = mismo nombre completo, o mismo teléfono y mismo primer nombre. */
function encontrarDuplicados(S, soloSeguros) {

function tarjetaPersona(r) {
  const p = r.p, t = r.t, c = r.c, hoy = HOY(); let grande, sub;
  const u = n => n === 1 ? 'día' : 'días';
  if (t.estado === 'porLlegar') { grande = `<b>${t.faltan}</b><span class="u">${u(t.faltan)} para que llegue</span>`; sub = 'Llega el ' + fLarga(p.ingreso); }
  else if (t.estado === 'salio') { grande = `<b>${t.dias}</b><span class="u">${u(t.dias)} vivió aquí</span><span class="y">${esc(t.texto)}</span>`; sub = 'Del ' + fCorta(p.ingreso) + ' al ' + fCorta(p.salida); }
  else { grande = `<b>${t.dias}</b><span class="u">${u(t.dias)} en la casa</span><span class="y">${t.dias === 0 ? 'llegó hoy' : (t.mesesTotal > 0 ? esc(t.texto) : '')}</span>`; sub = 'Desde el ' + fLarga(p.ingreso); }
  if (p.ingresoProvisional) sub += ' (fecha provisional)';
  const precio = pesos(precioEn(p, t.estado === 'porLlegar' ? p.ingreso : hoy)) + (p.unidad === 'dia' ? ' / día' : ' / mes');
  let prox = '—';
  if (t.estado !== 'salio') { if (c.deuda > 0) prox = 'Ya toca'; else if (c.proximo) prox = fSinAnio(c.proximo.fecha) + ' · ' + enDias(dif(c.proximo.fecha, hoy)); }
  let saldo = '<span class="pos">Al día</span>';
  if (t.estado === 'porLlegar') saldo = c.proximo ? 'Primer cobro ' + pesos(c.proximo.monto) : '—';
  else if (c.deuda > 0) saldo = '<span class="neg">Debe ' + pesos(c.deuda) + '</span>';
  else if (c.aFavor > 0) saldo = '<span class="pos">A favor ' + pesos(c.aFavor) + '</span>';
  return `<article class="card persona ${r.nivel}">
    <div class="p-top"><div><h3><a href="#/persona/${p.id}">${esc(p.nombre)}</a></h3><div class="desde">${esc(p.cuarto ? p.cuarto + ' · ' : '')}${esc(sub)}</div></div>${chip(r.nivel, r.etiqueta)}</div>
    <div class="dias">${grande}</div>
    ${cicloHTML(p, c, hoy)}
    <dl class="datos"><div><dt>Paga</dt><dd>${precio}</dd></div><div><dt>Próximo pago</dt><dd>${esc(prox)}</dd></div><div><dt>Saldo</dt><dd>${saldo}</dd></div></dl>
    <div class="fila">${t.estado !== 'porLlegar' ? `<button class="btn chico primario" data-a="nuevoPago" data-id="${p.id}" type="button">Registrar pago</button>` : ''}<a class="btn chico" href="#/persona/${p.id}">Ver ficha</a></div>
  </article>`;
}
/* "Lleva 9 de 31 días de este periodo · faltan 23 para pagar" con su barra de avance */
function cicloHTML(p, c, hoy) {
  const cy = cicloActual(p, hoy); if (!cy) return '';
  const pago = c.deuda > 0 ? '<b class="neg">Ya toca pagar</b>' : (c.proximo ? 'Faltan <b>' + dif(c.proximo.fecha, hoy) + '</b> ' + (dif(c.proximo.fecha, hoy) === 1 ? 'día' : 'días') + ' para pagar' : 'Pago al día');
  return '<div class="ciclo"><div class="etq">' + (cy.calendario ? 'Este mes' : 'Periodo actual') + ' · ' + esc(fSinAnio(cy.ini)) + ' → ' + esc(fSinAnio(sumarDias(cy.fin, -1))) + '</div><div class="barra"><i style="width:' + cy.pct + '%"></i></div><div class="l"><span>Lleva <b>' + cy.dia + '</b> de ' + cy.total + ' días</span><span>' + pago + '</span></div></div>';

function htmlLinea(lt) {

function dlgFactura(id) {

function vistaResumen(mes) {
  const hoy = HOY(); const m = /^\d{4}-\d{2}$/.test(mes || '') ? mes : hoy.slice(0, 7);
  const ini = m + '-01', finEx = sumarMeses(ini, 1), ultimo = sumarDias(finEx, -1);
  const filas = S.personas.filter(p => p.ingreso <= ultimo && (!p.salida || p.salida >= ini)).map(p => {
    const c = estadoCuenta(S, p, ultimo, finEx);
    const cargos = c.cargos.filter(x => x.fecha >= ini && x.fecha < finEx).reduce((s, x) => s + x.monto, 0);
    const pagado = S.pagos.filter(x => x.personaId === p.id && x.tipo !== 'descuento' && x.fecha >= ini && x.fecha < finEx).reduce((s, x) => s + x.monto, 0);
    const desc = S.pagos.filter(x => x.personaId === p.id && x.tipo === 'descuento' && x.fecha >= ini && x.fecha < finEx).reduce((s, x) => s + x.monto, 0);
    return { p, cargos, pagado, desc, saldo: c.totalCargado - c.totalPagado - c.totalDescuentos };
  });
  const tot = filas.reduce((a, f) => ({ cargos: a.cargos + f.cargos, pagado: a.pagado + f.pagado, saldo: a.saldo + f.saldo }), { cargos: 0, pagado: 0, saldo: 0 });
  const facts = S.facturas.filter(f => f.cobrarEl >= ini && f.cobrarEl < finEx);
  const pct = tot.cargos > 0 ? Math.min(100, Math.round(tot.pagado / tot.cargos * 100)) : 0;
  return `<div class="hero"><div><h1>Resumen de ${esc(mayuscula1(fMes(ini)))}</h1><div class="hoy">Lo que se cobró, lo que se recibió y lo que quedó pendiente al cerrar el mes</div></div><div class="sep"></div><a class="btn" href="#/resumen/${sumarMeses(ini, -1).slice(0, 7)}">← Mes anterior</a><a class="btn" href="#/resumen/${sumarMeses(ini, 1).slice(0, 7)}">Mes siguiente →</a></div>
  <div class="rejilla chica"><div class="kpi"><span>Se cobró este mes</span><b>${esc(pesos(tot.cargos))}</b></div><div class="kpi verde"><span>Se recibió este mes</span><b>${esc(pesos(tot.pagado))}</b><small>${pct}% de lo cobrado</small></div><div class="kpi ${tot.saldo > 0 ? 'rojo' : 'verde'}"><span>Pendiente al cierre</span><b>${esc(pesos(tot.saldo))}</b></div></div>
  <div class="card mt"><div class="barra"><i style="width:${pct}%"></i></div></div>
  <div class="card mt tabla-wrap">${filas.length ? `<table><thead><tr><th>Persona</th><th class="num">Cobrado</th><th class="num">Pagó</th><th class="num">Descuentos</th><th class="num">Saldo al cierre</th></tr></thead><tbody>${filas.map(f => `<tr><td><a href="#/persona/${f.p.id}">${esc(f.p.nombre)}</a></td><td class="num">${esc(pesos(f.cargos))}</td><td class="num pos">${esc(pesos(f.pagado))}</td><td class="num">${esc(pesos(f.desc))}</td><td class="num ${f.saldo > 0 ? 'neg' : 'pos'}">${f.saldo > 0 ? esc(pesos(f.saldo)) : (f.saldo < 0 ? 'A favor ' + esc(pesos(-f.saldo)) : 'Al día')}</td></tr>`).join('')}<tr><td><b>Total</b></td><td class="num"><b>${esc(pesos(tot.cargos))}</b></td><td class="num"><b>${esc(pesos(tot.pagado))}</b></td><td></td><td class="num"><b>${esc(pesos(tot.saldo))}</b></td></tr></tbody></table>` : '<p class="vacio">Nadie vivía en la casa en este mes.</p>'}</div>
  ${facts.length ? `<div class="titulo-sec"><h2>Servicios de este mes</h2></div><div class="card tabla-wrap"><table><thead><tr><th>Servicio</th><th class="num">Factura</th><th class="num">Repartido a otros</th><th class="num">Me tocó a mí</th></tr></thead><tbody>${facts.map(f => { const r = repartoFactura(S, f); return `<tr><td>${esc(f.concepto)}</td><td class="num">${esc(pesos(f.total))}</td><td class="num">${esc(pesos(r.repartido))}</td><td class="num">${esc(pesos(f.total - r.repartido))}</td></tr>`; }).join('')}</tbody></table></div>` : ''}`;
}

/* sube una imagen (logo o firma) reducida para que no pese en el navegador */
function leerImagen(file, maxPx, cb) {
  const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, maxPx / Math.max(im.width, im.height)); const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(im.width * k)); cv.height = Math.max(1, Math.round(im.height * k)); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); cb(cv.toDataURL('image/png')); }; im.onerror = () => toast('No pude leer esa imagen.', { error: true }); im.src = rd.result; };
  rd.readAsDataURL(file);
}

function plantillaFiesta(e) {
  const cuando = e ? fLarga(e.fecha) : '[la fecha]'; const cierre = e && e.horaFin ? ' Pensamos cerrar a las ' + e.horaFin + (/[.!?]$/.test(e.horaFin) ? '' : '.') : '';
  return 'Hola a todos 🎉 Estoy pensando en organizar ' + (e ? '«' + e.nombre + '»' : 'una reunión') + ' el ' + cuando + '. Antes de confirmar quiero saber si les parece bien.' + cierre + '\n\nSi va, nos organizamos entre todos: quién compra qué, la hora de cierre, y que al día siguiente hagamos el aseo juntos (todos ayudamos y queda rápido). Ya dejé el plan armado en la app con lo que le toca a cada uno.\n\n¿Qué opinan?';
}
function cuando() { return S.cfg.proximaReunion ? 'el ' + fLarga(S.cfg.proximaReunion) : 'esta semana (díganme qué día les queda bien)'; }

  { id: 'reunion', titulo: 'Convocar la reunión de casa', persona: false, texto: c => 'Hola a todos 👋 Quiero que nos sentemos 15 minutos ' + cuando() + ' para hablar de cómo vamos en la casa: lo que está funcionando, lo que podemos mejorar y organizar lo que viene. No es para regañar a nadie, es para que todos nos sintamos bien aquí. ¿Les sirve? Si quieren, cada uno trae una cosa que le gustaría cambiar.' },

  { id: 'bienvenida', titulo: 'Bienvenida a quien llega', persona: true, texto: c => 'Hola ' + (c.p ? primerNombre(c.p) : '[nombre]') + ', qué alegría que te sumes a la casa 🏠\n\nAntes de que llegues quiero contarte cómo vivimos acá, para que desde el primer día te sientas en casa: somos un equipo. Repartimos el aseo por turnos, cada uno cuida lo suyo y respeta lo ajeno, y cuando hay planes los organizamos entre todos.\n\nTe voy a pasar el acuerdo de la casa para que lo leas con calma; si algo no te cuadra, lo hablamos.' + (c.p && c.p.ingreso >= HOY() ? ' Llegas el ' + fLarga(c.p.ingreso) + '.' : '') + ' ¡Nos vemos pronto!' },
  { id: 'aseo', titulo: 'Recordar su turno de aseo', persona: true, texto: c => { const f = c.p ? aseoSemana(S, lunesDe(HOY()), HOY()).filter(x => x.part && x.part.id === c.p.id && !x.hecho) : []; const zs = f.length ? f.map(x => x.zona.nombre).join(' y ') : '[la zona]'; return 'Hola ' + (c.p ? primerNombre(c.p) : '[nombre]') + ' 🙂 Te recuerdo que esta semana te tocó ' + zs + ' en el aseo de la casa. Se cierra el ' + fSinAnio(limiteAseo(S, lunesDe(HOY()))) + '. Si se te complica, me avisas y lo cambiamos con alguien. ¡Gracias por ayudar a que la casa esté chévere!'; } },
  { id: 'pago', titulo: 'Recordar un pago, con cariño', persona: true, texto: c => c.p ? textoCobro(c.p) : 'Hola [nombre] 👋 Un recordatorio amistoso de tu pago de la casa. Si se te complicó, cuéntame y lo miramos. ¡Gracias!' },
  { id: 'faltante', titulo: 'Algo no aparece (sin acusar)', persona: false, texto: c => 'Hola a todos, no encuentro ' + (c.detalle || '[escribe qué cosa]') + ' y quiero preguntarles con calma si alguien la ha visto o la tiene (a veces se prestan o se cambian de lugar). Si la tienen, no pasa nada: solo avísenme para saber dónde está. Gracias 🙏' },
  { id: 'fiesta', titulo: 'Proponer una fiesta o reunión', persona: false, texto: c => plantillaFiesta(S.eventos.filter(e => e.fecha >= HOY() && !e.cerrado).sort((a, b) => a.fecha < b.fecha ? -1 : 1)[0]) },

function guionPresentar() {

}
function vistaGuia() {

    <li><b>Tú también cumples.</b> El acuerdo incluye lo que tú te comprometes a hacer; eso cambia por completo el tono.</li></ul></details>
  <details class="d" open><summary>2. Lo que puedes decir (guion de un minuto)</summary><p class="peq">Está armado con los datos de tu casa. Léelo en voz alta una vez antes, para que te suene tuyo; cambia lo que quieras con tus palabras.</p><div class="cita">${esc(guionPresentar())}</div><div class="fila mt2"><button class="btn chico" data-a="copiarGuion" type="button">Copiar el guion</button></div></details>
  <details class="d"><summary>3. Frases que suman y frases que chocan</summary><div class="si-no"><div class="si"><b>Suman</b><ul style="margin:6px 0 0 18px;padding:0"><li>«Lo armé pensando en todos.»</li><li>«¿Qué le cambiarían?»</li><li>«Yo también me comprometo.»</li><li>«Quiero que estemos cómodos.»</li><li>«Cuéntame cómo lo ves.»</li><li>«Gracias por ayudar, se nota.»</li></ul></div><div class="no"><b>Chocan</b><ul style="margin:6px 0 0 18px;padding:0"><li>«Aquí se hace lo que yo digo.»</li><li>«Siempre dejan todo tirado.»</li><li>«Ustedes nunca…»</li><li>«Estoy cansado de ser el único que…»</li><li>«Eso es problema suyo.»</li><li>«Si no les gusta, se van.»</li></ul></div></div></details>
  <details class="d"><summary>4. Cuando algo no se cumple: la fórmula de tres frases</summary>
    <p><b>1) El hecho</b>, sin adjetivos · <b>2) Cómo te afecta</b> · <b>3) Una propuesta</b>, no una orden.</p>
    <ul style="margin:0 0 8px 18px;padding:0"><li><b>Aseo:</b> «La cocina quedó con los platos de ayer. Me incomoda porque termino limpiando yo. ¿Podemos lavarlos el mismo día?»</li><li><b>Plata:</b> «El pago del 5 todavía no me llega. Necesito tener claro el mes para pagar los servicios. ¿Cuándo puedes ponerte al día?»</li><li><b>Cosas ajenas:</b> «Vi que se usó mi cargador sin avisarme. Me da inquietud no saber dónde queda mis cosas. ¿La próxima me preguntas antes?»</li><li><b>Ruido:</b> «Anoche la música se escuchaba afuera. Me preocupa que los vecinos se quejen. ¿La bajamos después de las 10?»</li></ul>
    <p><b>Si se repite, sube de a un escalón:</b></p><ol style="margin:0 0 0 18px;padding:0"><li>Conversación en privado y tranquila (la primera vez siempre es una conversación).</li><li>Un recordatorio por escrito, amable, y acuerdan qué va a cambiar.</li><li>Una conversación seria, con el acuerdo en la mano, sobre si así funciona la convivencia.</li></ol><p class="peq mt2">Nunca reclamar delante de otros ni por el grupo: la gente corrige más rápido cuando no se siente humillada.</p></details>
  <details class="d" open><summary>5. Mensajes listos para copiar</summary>
    <div class="dos-col">${F.sel('¿Qué quieres decir?', 'plantilla', PLANTILLAS.map(p => [p.id, p.titulo]), guiaSel.id).replace('<select ', '<select data-i="guiaCampo" data-k="id" ')}${F.sel('¿A quién? (si aplica)', 'pers', [['', 'A toda la casa']].concat(S.personas.map(p => [p.id, p.nombre])), guiaSel.pid).replace('<select ', '<select data-i="guiaCampo" data-k="pid" ')}</div>
    <label class="fld"><span>Detalle (si hace falta)</span><input type="text" data-i="guiaCampo" data-k="detalle" value="${esc(guiaSel.detalle)}" placeholder="Ej: mi cargador negro · la cocina · las 2 p. m." autocomplete="off"><small>Se mete dentro del mensaje cuando el texto lo pide.</small></label>
    <textarea id="guiaOut" rows="9" style="width:100%">${esc(textoGuia())}</textarea>
    <div class="fila mt2"><button class="btn" data-a="copiarGuia" type="button">Copiar texto</button><a class="btn primario" id="guiaWa" target="_blank" rel="noopener" href="${esc(waLink((persona(guiaSel.pid) || {}).telefono || '', textoGuia()))}">Abrir en WhatsApp</a></div></details>
  <details class="d" open><summary>6. Reunión de casa cada mes (15 minutos)</summary>
    <p>Es lo que hace que el acuerdo no se quede en papel: un rato corto para ver cómo van y ajustar. Una idea de orden:</p><ol style="margin:0 0 10px 18px;padding:0"><li><b>Lo bueno:</b> cada uno dice una cosa que le gusta de vivir aquí.</li><li><b>Lo que no está funcionando</b> (sin culpar a nadie).</li><li><b>Ajustes al acuerdo:</b> qué cambiamos.</li><li><b>Lo que viene:</b> fiestas, compras, visitas.</li></ol>
    <div class="fila"><span>${reu ? 'Próxima reunión: <b>' + esc(fLarga(reu)) + '</b> (' + esc(enDias(dif(reu, hoy))) + ')' : 'Todavía no hay una reunión programada.'}</span><button class="btn chico" data-a="programarReunion" type="button">${reu ? 'Cambiar la fecha' : 'Programarla'}</button>${reu ? '<button class="btn chico fantasma" data-a="quitarReunion" type="button">Quitarla</button>' : ''}</div></details>
  <details class="d"><summary>7. Cuando llega alguien nuevo: lista del primer día</summary><ul style="margin:0 0 0 18px;padding:0"><li>Recorrido por la casa y presentación del turno de aseo.</li><li>Entregar llaves y anotarlas en <a href="#/conv/cosas">Prestado y entregado</a>.</li><li>Conversar el acuerdo de la casa (sin prisa) y marcar que lo aceptó.</li><li>Acordar el precio, la fecha de pago y el depósito, y anotarlos en su ficha.</li><li>Mostrarle dónde están las cosas importantes y las zonas para consumir.</li><li>Presentarlo con los demás y pasarle los datos de pago.</li></ul></details>`;
}

/* ===========================================================================

/* Logo: la Ñ de Peñuela con el techo de una casa como tilde. Sin letras dentro (no depende de ninguna fuente). */

  + '<linearGradient id="cpBrillo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient></defs>'
  + '<rect width="120" height="120" rx="30" fill="url(#cpFondo)"/><rect width="120" height="120" rx="30" fill="url(#cpBrillo)"/>'
  + '<rect x=".75" y=".75" width="118.5" height="118.5" rx="29.25" fill="none" stroke="#C7CBFF" stroke-opacity=".28" stroke-width="1.5"/>'
  + '<path d="M34 42 L60 22 L86 42" fill="none" stroke="#F5B14C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>'
  + '<path d="M40 98 V58 L80 98 V58" fill="none" stroke="#F4F5FB" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function logoHTML() { return S.cfg.logo ? '<img src="' + String(S.cfg.logo).replace(/["<>\s]/g, '') + '" alt="Logo">' : LOGO_SVG; }

}
const dEsc = esc;
const dLineas = l => l.map(x => dEsc(x)).join('<br>');

function dHero(kicker, titulo, codigo, sub) {

function dPartes(t1, n1, l1, t2, n2, l2) {

}
function dFranja(celdas) { return '<div style="padding:14px 52px 0"><div class="d-franja" style="grid-template-columns:repeat(' + celdas.length + ',minmax(0,1fr))">' + celdas.map(c => '<div class="d-celda"><div class="d-lbl">' + dEsc(c[0]) + '</div><div class="d-val">' + dEsc(c[1]) + '</div></div>').join('') + '</div></div>'; }
function dSeccion(t) { return '<h2>' + dEsc(t) + '</h2><div class="d-barra"></div>'; }

/* ---------- informe de cuentas (cruce de ingresos y servicios) ---------- */
function informeHTML(desde, hasta) {
  const hoy = HOY(), a = arrendador(), c = cruceCuentas(S, desde, hasta, hoy), t = c.total; const cod = 'IC-' + hoy.replace(/-/g, '').slice(0, 6);
  const periodo = desde === hasta ? fMes(desde + '-01') : fMes(desde + '-01') + ' a ' + fMes(hasta + '-01');
  const corto = m => MES3[+m.slice(5, 7) - 1] + ' ' + m.slice(2, 4);
  const th = (a1, a2, a3, a4, a5) => '<div class="d-thead"><div>' + a1 + '</div><div>' + a2 + '</div><div class="d-r">' + a3 + '</div><div class="d-r">' + a4 + '</div><div class="d-r">' + a5 + '</div></div>';

  return dTop('Informe de cuentas ' + cod, S.cfg.casa)
    + dHero(S.cfg.casa + ' · cruce de cuentas', 'Informe de cuentas', cod, dCiudadFecha(hoy))
    + dPartes('Periodo', periodo, ['Informe al ' + fLarga(hoy)], 'Arrendador', a.nombre, a.lineas.length ? a.lineas : [S.cfg.casa])
    + dFranja([['Entró', pesos(t.entro)], ['Servicios', pesos(t.servicios)], ['Te quedó', pesos(t.queda)], ['Por cobrar hoy', pesos(c.porCobrar)]])
    + dPad(dSeccion('1. Mes a mes') + th('Mes', 'Detalle', 'Servicios', 'Entró', 'Te quedó') + filasMes, 38)

    + dPad(dSeccion((gastos.length ? '3' : '2') + '. Saldo de cada inquilino') + th('Cuarto', 'Inquilino', 'Cargado', 'Abonado', 'Saldo') + filasPers, 38)
    + dPad(dTotal('Te quedó en el periodo', pesos(t.queda), 'Entró ' + pesos(t.entro) + (t.abonos ? ' (plata ' + pesos(t.recibido) + ' + abonos ' + pesos(t.abonos) + ')' : '') + ' menos servicios ' + pesos(t.servicios) + '.', [['Entró', pesos(t.entro)], ['Servicios', pesos(t.servicios)], ['Por cobrar hoy', pesos(c.porCobrar)]]), 38)
    + dPie(S.cfg.casa + (S.cfg.ciudad ? ' · ' + S.cfg.ciudad : ''), cod + ' · ' + fCorta(hoy));

/* vista previa dentro de un diálogo: el documento mide 860 px, se reduce para que quepa */

/* ===========================================================================
   Casa Peñuela — servicios mes a mes, cruce de cuentas, informe, inquilinos duplicados y papelera

   =========================================================================== */
const CONCEPTOS_SERVICIO = ['Luz', 'Agua', 'Internet', 'Gas', 'Aseo y basuras', 'Otro'];
let rangoCruce = null;

/* copia del estado SIN la clave API: es lo que sale en los respaldos */
function sinSecretos(estado) {
  const c = JSON.parse(JSON.stringify(estado));

/* =========================  SERVICIOS MES A MES  ========================= */
function vistaServicios() {
  const hoy = HOY(), mesAct = mesDe(hoy);
  const meses = Array.from(new Set(S.gastos.map(g => g.mes).concat([mesAct]))).sort().reverse();

  const prom = conDatos.length ? Math.round(conDatos.reduce((s, m) => s + totalGastosMes(S, m), 0) / conDatos.length) : 0;
  const kpi = (t, v, s, c) => '<div class="kpi ' + (c || '') + '"><span>' + t + '</span><b>' + v + '</b><small>' + s + '</small></div>';
  const tarjeta = m => {
    const gs = gastosDelMes(S, m).sort((a, b) => a.concepto < b.concepto ? -1 : 1);

  };
  return `<div class="hero"><div><h1>Servicios de la casa</h1><div class="hoy">Lo que pagas tú cada mes: luz, agua, internet… Van incluidos en el cuarto; aquí se anotan para el cruce de cuentas.</div></div><div class="sep"></div>
    <button class="btn" data-a="copiarMesGastos" type="button">Copiar el mes pasado</button><a class="btn" href="#/cruce">Ver cruce de cuentas</a><button class="btn primario" data-a="nuevoGasto" type="button">+ Registrar servicio</button></div>
    <div class="rejilla chica">${kpi('Servicios de este mes', pesos(totalGastosMes(S, mesAct)), plural(gastosDelMes(S, mesAct).length, 'registro', 'registros'))}${kpi('Por pagar', pesos(sinPagar), 'servicios sin marcar como pagados', sinPagar > 0 ? 'ambar' : 'verde')}${kpi('Promedio por mes', pesos(prom), 'en ' + plural(conDatos.length, 'mes con datos', 'meses con datos'))}</div>
    ${meses.map(tarjeta).join('')}
    ${S.cfg.serviciosIncluidos ? '' : '<hr style="border:0;border-top:1px solid var(--line);margin:28px 0">' + vistaFacturasRepartidas()}`;
}
function dlgGasto(id, mesPre) {
  const ex = id ? S.gastos.find(g => g.id === id) : null;
  const v = ex || { concepto: '', mes: mesPre || mesDe(HOY()), valor: 0, pagadoEl: '', nota: '' };
  dialogo({
    titulo: ex ? 'Editar servicio' : 'Registrar un servicio del mes',
    cuerpo: `${F.txt('¿Qué servicio es?', 'concepto', v.concepto, { list: 'conceptosServ', ph: 'Luz, agua, internet…' })}<datalist id="conceptosServ">${CONCEPTOS_SERVICIO.map(c => '<option>' + c + '</option>').join('')}</datalist>
      <div class="dos-col">${F.txt('¿De qué mes es?', 'mes', v.mes, { t: 'month', h: 'El mes al que corresponde el consumo.' })}${F.din('Valor', 'valor', v.valor)}</div>
      ${F.fec('Pagado el (déjalo vacío si aún no lo pagas)', 'pagadoEl', v.pagadoEl || '')}
      ${F.txt('Nota (opcional)', 'nota', v.nota, { ph: 'Ej: factura del mes, incluye reajuste' })}`,
    onOk(fd) {
      const concepto = mayuscula1(fd.get('concepto').trim()), mes = fd.get('mes'), valor = num(fd.get('valor')), pagadoEl = fd.get('pagadoEl') || '';
      if (!concepto) return 'Escribe qué servicio es.'; if (!/^\d{4}-\d{2}$/.test(mes)) return 'Escoge el mes.'; if (valor <= 0) return 'Pon el valor.'; if (pagadoEl && !esFecha(pagadoEl)) return 'Revisa la fecha de pago.';
      if (S.gastos.some(g => g.id !== (ex && ex.id) && g.mes === mes && normNombre(g.concepto) === normNombre(concepto) && g.valor === valor)) return 'Ya registraste ese mismo servicio, del mismo mes y con el mismo valor.';
      const d = { concepto, mes, valor, pagadoEl, nota: fd.get('nota').trim() };
      if (ex) mutar('Se corrigió ' + concepto + ' de ' + fMes(mes + '-01'), () => Object.assign(S.gastos.find(g => g.id === ex.id), d));
      else mutar('Servicio registrado: ' + concepto + ' ' + pesos(valor) + ' (' + fMes(mes + '-01') + ')', () => S.gastos.push(Object.assign({ id: uid() }, d)));
    }
  });
}
ACC.nuevoGasto = d => dlgGasto(null, d && d.mes);
ACC.editarGasto = d => dlgGasto(d.id);
ACC.borrarGasto = d => { const g = S.gastos.find(x => x.id === d.id); mutar('Se borró ' + g.concepto + ' de ' + fMes(g.mes + '-01'), () => { S.gastos = S.gastos.filter(x => x.id !== g.id); }); };
ACC.gastoPagado = d => { const g = S.gastos.find(x => x.id === d.id); mutar(g.concepto + ' de ' + fMes(g.mes + '-01') + ' marcado como pagado', () => { S.gastos.find(x => x.id === g.id).pagadoEl = HOY(); }); };
ACC.copiarMesGastos = () => {
  const act = mesDe(HOY()), prev = sumarMeses(act + '-01', -1).slice(0, 7); const base = gastosDelMes(S, prev);
  if (!base.length) { toast('El mes pasado no tiene servicios registrados para copiar.', { error: true }); return; }
  const faltan = base.filter(b => !gastosDelMes(S, act).some(g => normNombre(g.concepto) === normNombre(b.concepto)));
  if (!faltan.length) { toast('Este mes ya tiene todos esos servicios.'); return; }
  mutar('Se copiaron ' + faltan.length + ' servicios del mes pasado a este mes (revisa los valores)', () => faltan.forEach(b => S.gastos.push({ id: uid(), concepto: b.concepto, mes: act, valor: b.valor, pagadoEl: '', nota: 'Copiado del mes pasado: confirma el valor' })));
};

/* =========================  CRUCE DE CUENTAS  ========================= */

  const kpi = (tit, v, s, cl) => '<div class="kpi ' + (cl || '') + '"><span>' + tit + '</span><b>' + v + '</b><small>' + s + '</small></div>';
  const mesN = m => esc(mayuscula1(fMes(m + '-01')));
  return `<div class="hero"><div><h1>Cruce de cuentas</h1><div class="hoy">Lo que entró contra lo que costaron los servicios, mes a mes</div></div><div class="sep"></div>
    <button class="btn" data-a="informePDF" type="button">Informe (PDF)</button><button class="btn primario" data-a="enviarInforme" type="button">Enviar informe…</button></div>
  <div class="card"><div class="fila"><label class="fld" style="margin:0"><span>Desde</span><input type="month" value="${desde}" data-c="cruceRango" data-k="desde"></label><label class="fld" style="margin:0"><span>Hasta</span><input type="month" value="${hasta}" data-c="cruceRango" data-k="hasta"></label><span class="sep"></span>
    <button class="btn chico" data-a="cruceAtajo" data-w="mes" type="button">Este mes</button><button class="btn chico" data-a="cruceAtajo" data-w="pasado" type="button">Mes pasado</button><button class="btn chico" data-a="cruceAtajo" data-w="anio" type="button">Este año</button><button class="btn chico" data-a="cruceAtajo" data-w="todo" type="button">Todo</button></div></div>
  ${S.gastos.length ? '' : '<div class="aviso-caja mt2">Todavía no has registrado servicios, así que «Te quedó» es igual a «Entró». <a href="#/servicios">Registrar servicios</a></div>'}
  <div class="rejilla chica mt">${kpi('Entró', pesos(t.entro), 'plata ' + pesos(t.recibido) + (t.abonos ? ' + abonos ' + pesos(t.abonos) : ''), 'verde')}${kpi('Servicios', pesos(t.servicios), 'lo que pagaste tú')}${kpi('Te quedó', pesos(t.queda), 'entró − servicios', t.queda < 0 ? 'rojo' : 'verde')}${kpi('Por cobrar hoy', pesos(c.porCobrar), 'lo que aún deben', c.porCobrar > 0 ? 'ambar' : 'verde')}</div>
  <div class="card mt tabla-wrap"><table><thead><tr><th>Mes</th><th class="num">Esperado</th><th class="num">Plata recibida</th><th class="num">Abonos</th><th class="num">Servicios</th><th class="num">Te quedó</th></tr></thead><tbody>${c.filas.map(f => `<tr><td>${mesN(f.mes)}</td><td class="num">${esc(pesos(f.esperado))}</td><td class="num pos">${esc(pesos(f.recibido))}</td><td class="num">${esc(pesos(f.abonos))}</td><td class="num">${esc(pesos(f.servicios))}</td><td class="num ${f.queda < 0 ? 'neg' : 'pos'}">${esc(pesos(f.queda))}</td></tr>`).join('')}
    <tr><td><b>Total</b></td><td class="num"><b>${esc(pesos(t.esperado))}</b></td><td class="num"><b>${esc(pesos(t.recibido))}</b></td><td class="num"><b>${esc(pesos(t.abonos))}</b></td><td class="num"><b>${esc(pesos(t.servicios))}</b></td><td class="num ${t.queda < 0 ? 'neg' : 'pos'}"><b>${esc(pesos(t.queda))}</b></td></tr></tbody></table></div>
  <div class="info-caja mt"><b>Cómo se calcula.</b> <i>Entró</i> = la plata que recibiste + los abonos (como el de un trabajo que te hicieron). <i>Te quedó</i> = lo que entró menos lo que costaron los servicios de ese mes. <i>Esperado</i> es lo que vencía ese mes: si todos estuvieran al día, ese sería el ingreso. Si dejas pasar un mes sin registrar servicios, ese mes «queda» completo.</div>`;
}
CAMBIOS.cruceRango = el => { if (!/^\d{4}-\d{2}$/.test(el.value)) return; rangoCruce = rangoActual(); rangoCruce[el.dataset.k] = el.value; render(); };
ACC.cruceAtajo = d => {
  const act = mesDe(HOY());
  if (d.w === 'mes') rangoCruce = { desde: act, hasta: act };
  else if (d.w === 'pasado') { const p = sumarMeses(act + '-01', -1).slice(0, 7); rangoCruce = { desde: p, hasta: p }; }
  else if (d.w === 'anio') rangoCruce = { desde: act.slice(0, 4) + '-01', hasta: act };
  else rangoCruce = rangoPorDefecto(S, HOY());

};
ACC.informePDF = () => { const r = rangoActual(); imprimir(informeHTML(r.desde, r.hasta)); };
ACC.enviarInforme = () => dlgInforme();
ACC.copiarInforme = () => copiar($('#infTxt').value);

      <div class="dos-col">${F.txt('WhatsApp de quien lo recibe', 'informeWhatsApp', S.cfg.informeWhatsApp, { ph: '300 123 4567', h: 'Vacío = escoges el chat al abrir WhatsApp.' })}${F.txt('Correo de quien lo recibe', 'informeCorreo', S.cfg.informeCorreo, { ph: 'nombre@correo.com' })}</div>
      <textarea id="infTxt" rows="14" style="width:100%">${esc(texto)}</textarea>`,
